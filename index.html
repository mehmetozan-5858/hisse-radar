<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><link rel="manifest" href="manifest.webmanifest"><title>Hisse Radar</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#07101d;color:#eef5ff}.wrap{max-width:760px;margin:auto;padding:22px}.hero{padding:24px;border-radius:24px;background:#101d31;border:1px solid #223655}.badge{color:#76d4ff;font-weight:700}.search{display:flex;gap:8px;margin:20px 0}.search input{flex:1;padding:15px;border-radius:14px;border:1px solid #30496d;background:#0b1627;color:white;font-size:16px}.search button{padding:0 18px;border:0;border-radius:14px;background:#35a7ff;color:#00162b;font-weight:800}.score{font-size:64px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#0d192b;border:1px solid #203553;border-radius:18px;padding:16px}.card b{display:block;margin-bottom:8px}.muted{color:#9fb1c8;font-size:13px}.bar{height:8px;background:#1b2a40;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#35a7ff}.foot{margin-top:22px;color:#8fa1b8;font-size:12px;line-height:1.5}@media(max-width:520px){.grid{grid-template-columns:1fr}.score{font-size:54px}}</style></head><body><div class="wrap"><div class="hero"><div class="badge">HİSSE RADAR</div><h1>Piyasa araştırma paneli</h1><div class="search"><input id="ticker" value="AAPL" placeholder="AAPL, NVDA, MSFT..."><button onclick="scan()">Tara</button></div><div class="muted" id="status">İlk sürüm hazır • Canlı veri bağlantısı sonraki adım</div></div><div style="display:flex;align-items:end;gap:14px;margin:24px 0"><div><div class="muted">Radar Puanı</div><div class="score" id="score">--</div></div><div class="muted" id="name">Sembol seç</div></div><div class="grid" id="grid"></div><div class="foot">Araştırma amaçlıdır; yatırım tavsiyesi değildir. Kongre ve kurumsal bildirimler işlem tarihinden sonra açıklanabilir. Her sinyalde kaynak ve tarih gösterilecek.</div></div><script>const cats=[['Insider işlemleri',20],['Kongre işlemleri',15],['Kurumsal hareket',10],['Analist revizyonları',15],['Finansal büyüme',15],['Değerleme',10],['Alternatif veri',5],['Momentum',10]];function scan(){let t=document.getElementById('ticker').value.trim().toUpperCase();if(!t)return;document.getElementById('name').textContent=t+' • veri bağlantısı bekleniyor';document.getElementById('score').textContent='—';document.getElementById('grid').innerHTML=cats.map(c=>`<div class="card"><b>${c[0]} <span class="muted">/${c[1]}</span></b><div class="bar"><i style="width:0%"></i></div><p class="muted">Canlı veri geldiğinde puan, gerekçe, tarih ve kaynak burada görünecek.</p></div>`).join('');document.getElementById('status').textContent=t+' için arayüz hazır • API bağlanınca otomatik güncellenecek'}scan();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
