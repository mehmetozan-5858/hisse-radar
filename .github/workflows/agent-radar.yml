name: Human Command Agent Radar

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: human-command-agent-radar
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API client
        if: env.OPENAI_API_KEY != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m pip install 'openai>=1.0,<3'
      - name: Run bounded research
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python agent_radar.py
      - name: Save research report
        run: |
          git config user.name "hisse-radar-bot"
          git config user.email "actions@github.com"
          git add data/agent-radar.json
          git diff --cached --quiet || (git commit -m "Update human command agent radar" && git push)
