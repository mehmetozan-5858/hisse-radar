name: Update Radar Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Radar verilerini güncelle
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          python <<'PY'
          import os
          import json
          import time
          from datetime import datetime, timezone, timedelta
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode
          import xml.etree.ElementTree as ET

          API_KEY = os.environ["FMP_API_KEY"]

          SEC_CONTACT_EMAIL = os.environ.get(
              "SEC_CONTACT_EMAIL",
              ""
          ).strip()

          SYMBOLS = [
              "AAPL",
              "MSFT",
              "NVDA",
              "AMZN",
              "GOOGL",
              "META",
              "TSLA",
              "AMD",
              "AVGO",
              "ORCL",
              "NFLX",
              "JPM",
              "V",
              "MA",
              "COST",
              "WMT",
              "CRM",
              "PLTR",
              "QCOM",
              "INTC"
          ]

          FMP_BASE = "https://financialmodelingprep.com/stable"

          SEC_HEADERS = {
              "User-Agent":
                  f"HisseRadar/1.0 {SEC_CONTACT_EMAIL}",
              "Accept":
                  "application/json,text/xml,application/xml,text/html",
              "Accept-Encoding":
                  "identity"
          }

          # ==============================================
          # ESKİ RADAR VERİSİNİ YEDEK OLARAK YÜKLE
          # ==============================================

          previous_stocks = {}

          try:
              with open(
                  "data/radar.json",
                  "r",
                  encoding="utf-8"
              ) as f:

                  previous_file = json.load(f)

              previous_stocks = {
                  item.get("symbol"): item
                  for item in previous_file.get(
                      "stocks",
                      []
                  )
                  if item.get("symbol")
              }

              print(
                  "Previous radar loaded:",
                  len(previous_stocks)
              )

          except Exception as e:

              print(
                  "Previous radar unavailable:",
                  repr(e)
              )

          # ==============================================
          # HTTP
          # ==============================================

          def get_json(url, headers=None):

              req = Request(
                  url,
                  headers=headers or {}
              )

              with urlopen(
                  req,
                  timeout=30
              ) as response:

                  raw = response.read()

              return json.loads(
                  raw.decode("utf-8")
              )

          def get_text(url, headers=None):

              req = Request(
                  url,
                  headers=headers or {}
              )

              with urlopen(
                  req,
                  timeout=30
              ) as response:

                  return response.read().decode(
                      "utf-8",
                      errors="ignore"
                  )

          # ==============================================
          # FMP
          # ==============================================

          def fmp(endpoint, params=None):

              p = dict(params or {})

              p["apikey"] = API_KEY

              url = (
                  FMP_BASE
                  + "/"
                  + endpoint
                  + "?"
                  + urlencode(p)
              )

              try:

                  data = get_json(url)

                  if isinstance(data, dict):

                      if data.get("Error Message"):
                          print(
                              "FMP API error:",
                              endpoint,
                              data.get(
                                  "Error Message"
                              )
                          )

                          return []

                  return data

              except Exception as e:

                  print(
                      "FMP error:",
                      endpoint,
                      repr(e)
                  )

                  return []

          # ==============================================
          # TOPLU FİYAT VERİSİ
          # ==============================================

          batch_quotes = fmp(
              "batch-quote",
              {
                  "symbols":
                      ",".join(SYMBOLS)
              }
          )

          QUOTE_MAP = {}

          if isinstance(
              batch_quotes,
              list
          ):

              for item in batch_quotes:

                  symbol_key = str(
                      item.get(
                          "symbol",
                          ""
                      )
                  ).upper()

                  if symbol_key:

                      QUOTE_MAP[
                          symbol_key
                      ] = item

          print(
              "Batch quote count:",
              len(QUOTE_MAP)
          )

          # ==============================================
          # 13F KURUMSAL VERİ
          # ==============================================

          institutional_data = {}

          try:

              with open(
                  "data/13f.json",
                  "r",
                  encoding="utf-8"
              ) as f:

                  institutional_file = json.load(f)

              institutional_data = (
                  institutional_file.get(
                      "stocks",
                      {}
                  )
              )

              print(
                  "13F loaded:",
                  institutional_file.get(
                      "version"
                  )
              )

          except Exception as e:

              print(
                  "13F load error:",
                  repr(e)
              )

          # ==============================================
          # SEC TICKER -> CIK
          # ==============================================

          CIK_MAP = {}

          try:

              ticker_data = get_json(
                  "https://www.sec.gov/files/company_tickers.json",
                  SEC_HEADERS
              )

              for item in ticker_data.values():

                  ticker = str(
                      item.get(
                          "ticker",
                          ""
                      )
                  ).upper()

                  cik = str(
                      item.get(
                          "cik_str",
                          ""
                      )
                  ).zfill(10)

                  if ticker and cik:

                      CIK_MAP[
                          ticker
                      ] = cik

              print(
                  "SEC ticker map:",
                  len(CIK_MAP)
              )

          except Exception as e:

              print(
                  "SEC ticker map error:",
                  repr(e)
              )

          # ==============================================
          # SEC FORM 4
          # ==============================================

          def sec_insider(symbol):

              previous = previous_stocks.get(
                  symbol,
                  {}
              ).get(
                  "insider",
                  {}
              )

              result = {
                  "score": None,
                  "max": 20,
                  "buys": 0,
                  "sells": 0,
                  "buyValue": 0,
                  "sellValue": 0,
                  "transactions": [],
                  "source": "SEC EDGAR",
                  "lookbackDays": 90,
                  "fresh": False
              }

              cik = CIK_MAP.get(
                  symbol
              )

              if not cik:

                  if previous:
                      previous = dict(previous)
                      previous["fresh"] = False
                      return previous

                  return result

              try:

                  submissions = get_json(
                      "https://data.sec.gov/submissions/CIK"
                      + cik
                      + ".json",
                      SEC_HEADERS
                  )

                  recent = (
                      submissions
                      .get(
                          "filings",
                          {}
                      )
                      .get(
                          "recent",
                          {}
                      )
                  )

                  forms = recent.get(
                      "form",
                      []
                  )

                  accessions = recent.get(
                      "accessionNumber",
                      []
                  )

                  filing_dates = recent.get(
                      "filingDate",
                      []
                  )

                  primary_docs = recent.get(
                      "primaryDocument",
                      []
                  )

                  cutoff = (
                      datetime.now(
                          timezone.utc
                      )
                      - timedelta(
                          days=90
                      )
                  )

                  form4s = []

                  for i, form in enumerate(
                      forms
                  ):

                      if str(
                          form
                      ).strip() != "4":

                          continue

                      if i >= len(
                          accessions
                      ):

                          continue

                      filing_date = (
                          filing_dates[i]
                          if i < len(
                              filing_dates
                          )
                          else None
                      )

                      if filing_date:

                          try:

                              dt = (
                                  datetime.strptime(
                                      filing_date,
                                      "%Y-%m-%d"
                                  )
                                  .replace(
                                      tzinfo=timezone.utc
                                  )
                              )

                              if dt < cutoff:
                                  continue

                          except Exception:
                              pass

                      primary_doc = (
                          primary_docs[i]
                          if i < len(
                              primary_docs
                          )
                          else None
                      )

                      if not primary_doc:
                          continue

                      form4s.append({
                          "accession":
                              accessions[i],
                          "filingDate":
                              filing_date,
                          "primaryDocument":
                              primary_doc
                      })

                      if len(
                          form4s
                      ) >= 20:

                          break

                  for filing in form4s:

                      accession = filing[
                          "accession"
                      ]

                      accession_clean = (
                          accession.replace(
                              "-",
                              ""
                          )
                      )

                      cik_nozero = str(
                          int(cik)
                      )

                      primary_doc = filing[
                          "primaryDocument"
                      ]

                      document_url = (
                          "https://www.sec.gov/Archives/edgar/data/"
                          + cik_nozero
                          + "/"
                          + accession_clean
                          + "/"
                          + primary_doc
                      )

                      try:

                          text = get_text(
                              document_url,
                              SEC_HEADERS
                          )

                          start = (
                              text.lower().find(
                                  "<ownershipdocument"
                              )
                          )

                          end = (
                              text.lower().find(
                                  "</ownershipdocument>"
                              )
                          )

                          if (
                              start == -1
                              or end == -1
                          ):

                              time.sleep(0.12)

                              continue

                          end += len(
                              "</ownershipDocument>"
                          )

                          root = ET.fromstring(
                              text[
                                  start:end
                              ]
                          )

                          owner_name = ""

                          owner_node = root.find(
                              ".//reportingOwner/"
                              "reportingOwnerId/"
                              "rptOwnerName"
                          )

                          if (
                              owner_node is not None
                              and owner_node.text
                          ):

                              owner_name = (
                                  owner_node.text.strip()
                              )

                          for tx in root.findall(
                              ".//nonDerivativeTransaction"
                          ):

                              code_node = tx.find(
                                  ".//transactionCoding/"
                                  "transactionCode"
                              )

                              shares_node = tx.find(
                                  ".//transactionAmounts/"
                                  "transactionShares/value"
                              )

                              price_node = tx.find(
                                  ".//transactionAmounts/"
                                  "transactionPricePerShare/value"
                              )

                              date_node = tx.find(
                                  ".//transactionDate/value"
                              )

                              if (
                                  code_node is None
                                  or not code_node.text
                              ):

                                  continue

                              code = (
                                  code_node.text
                                  .strip()
                                  .upper()
                              )

                              if code not in (
                                  "P",
                                  "S"
                              ):

                                  continue

                              try:

                                  shares = (
                                      float(
                                          shares_node.text
                                      )
                                      if shares_node
                                      is not None
                                      else 0
                                  )

                              except Exception:

                                  shares = 0

                              try:

                                  price = (
                                      float(
                                          price_node.text
                                      )
                                      if price_node
                                      is not None
                                      else 0
                                  )

                              except Exception:

                                  price = 0

                              value = (
                                  shares
                                  * price
                              )

                              transaction_date = (
                                  date_node.text.strip()
                                  if (
                                      date_node
                                      is not None
                                      and date_node.text
                                  )
                                  else None
                              )

                              tx_data = {
                                  "owner":
                                      owner_name,
                                  "code":
                                      code,
                                  "type":
                                      "BUY"
                                      if code == "P"
                                      else "SELL",
                                  "shares":
                                      shares,
                                  "price":
                                      price,
                                  "value":
                                      round(
                                          value,
                                          2
                                      ),
                                  "transactionDate":
                                      transaction_date,
                                  "filingDate":
                                      filing[
                                          "filingDate"
                                      ],
                                  "accession":
                                      accession,
                                  "sourceUrl":
                                      document_url
                              }

                              result[
                                  "transactions"
                              ].append(
                                  tx_data
                              )

                              if code == "P":

                                  result[
                                      "buys"
                                  ] += 1

                                  result[
                                      "buyValue"
                                  ] += value

                              else:

                                  result[
                                      "sells"
                                  ] += 1

                                  result[
                                      "sellValue"
                                  ] += value

                          time.sleep(
                              0.15
                          )

                      except Exception as e:

                          print(
                              symbol,
                              "Form4 document error:",
                              repr(e)
                          )

                  buy_value = result[
                      "buyValue"
                  ]

                  sell_value = result[
                      "sellValue"
                  ]

                  if (
                      buy_value == 0
                      and sell_value == 0
                  ):

                      score = 10

                  else:

                      total = (
                          buy_value
                          + sell_value
                      )

                      if total > 0:

                          balance = (
                              buy_value
                              - sell_value
                          ) / total

                          score = round(
                              10
                              + balance * 10
                          )

                      else:

                          score = 10

                  result["score"] = max(
                      0,
                      min(
                          20,
                          score
                      )
                  )

                  result["buyValue"] = round(
                      buy_value,
                      2
                  )

                  result["sellValue"] = round(
                      sell_value,
                      2
                  )

                  result[
                      "transactions"
                  ] = sorted(
                      result[
                          "transactions"
                      ],
                      key=lambda x: (
                          x.get(
                              "transactionDate"
                          ) or "",
                          x.get(
                              "filingDate"
                          ) or ""
                      ),
                      reverse=True
                  )[:25]

                  result[
                      "fresh"
                  ] = True

                  return result

              except Exception as e:

                  print(
                      symbol,
                      "SEC submissions error:",
                      repr(e)
                  )

                  if previous:

                      previous = dict(
                          previous
                      )

                      previous[
                          "fresh"
                      ] = False

                      return previous

                  return result

          # ==============================================
          # PUAN YARDIMCILARI
          # ==============================================

          def previous_component(
              symbol,
              component,
              default
          ):

              return (
                  previous_stocks
                  .get(
                      symbol,
                      {}
                  )
                  .get(
                      "radar",
                      {}
                  )
                  .get(
                      "components",
                      {}
                  )
                  .get(
                      component,
                      default
                  )
              )

          # ==============================================
          # RADAR
          # ==============================================

          stocks = []

          fresh_quote_count = 0

          cached_quote_count = 0

          for symbol in SYMBOLS:

              print(
                  "Processing:",
                  symbol
              )

              previous_stock = (
                  previous_stocks.get(
                      symbol,
                      {}
                  )
              )

              previous_fundamentals = (
                  previous_stock.get(
                      "fundamentals",
                      {}
                  )
              )

              previous_analyst = (
                  previous_stock.get(
                      "analyst",
                      {}
                  )
              )

              # ==========================================
              # FİYAT
              # ==========================================

              q = QUOTE_MAP.get(
                  symbol,
                  {}
              )

              quote_fresh = bool(
                  q.get(
                      "price"
                  ) is not None
              )

              if quote_fresh:

                  fresh_quote_count += 1

              else:

                  cached_quote_count += 1

                  q = {
                      "symbol":
                          symbol,
                      "name":
                          previous_stock.get(
                              "name"
                          ),
                      "price":
                          previous_stock.get(
                              "price"
                          ),
                      "change":
                          previous_stock.get(
                              "change"
                          ),
                      "changePercentage":
                          previous_stock.get(
                              "changePercentage"
                          ),
                      "volume":
                          previous_stock.get(
                              "volume"
                          ),
                      "marketCap":
                          previous_stock.get(
                              "marketCap"
                          )
                  }

              price = q.get(
                  "price"
              )

              change_pct = q.get(
                  "changePercentage"
              )

              # ==========================================
              # FMP TEMEL VERİLER
              # ==========================================

              growth = fmp(
                  "financial-growth",
                  {
                      "symbol":
                          symbol
                  }
              )

              ratios = fmp(
                  "ratios-ttm",
                  {
                      "symbol":
                          symbol
                  }
              )

              targets = fmp(
                  "price-target-consensus",
                  {
                      "symbol":
                          symbol
                  }
              )

              g = (
                  growth[0]
                  if (
                      isinstance(
                          growth,
                          list
                      )
                      and growth
                  )
                  else {}
              )

              r = (
                  ratios[0]
                  if (
                      isinstance(
                          ratios,
                          list
                      )
                      and ratios
                  )
                  else {}
              )

              t = (
                  targets[0]
                  if (
                      isinstance(
                          targets,
                          list
                      )
                      and targets
                  )
                  else {}
              )

              growth_fresh = bool(g)

              ratios_fresh = bool(r)

              targets_fresh = bool(t)

              # ==========================================
              # ANALİST /15
              # ==========================================

              analyst_score = previous_component(
                  symbol,
                  "analyst",
                  0
              )

              target = (
                  t.get(
                      "targetConsensus"
                  )
                  or t.get(
                      "targetMedian"
                  )
              )

              if (
                  price is not None
                  and target is not None
              ):

                  try:

                      upside = (
                          float(target)
                          / float(price)
                          - 1
                      ) * 100

                      if upside >= 30:
                          analyst_score = 15

                      elif upside >= 20:
                          analyst_score = 13

                      elif upside >= 10:
                          analyst_score = 10

                      elif upside >= 5:
                          analyst_score = 7

                      elif upside >= 0:
                          analyst_score = 4

                      else:
                          analyst_score = 1

                  except Exception:
                      pass

              # ==========================================
              # BÜYÜME /15
              # ==========================================

              growth_score = previous_component(
                  symbol,
                  "growth",
                  0
              )

              growth_values = []

              for key in [
                  "revenueGrowth",
                  "netIncomeGrowth",
                  "epsgrowth"
              ]:

                  value = g.get(
                      key
                  )

                  if value is not None:

                      try:

                          growth_values.append(
                              float(
                                  value
                              )
                          )

                      except Exception:
                          pass

              if growth_values:

                  avg_growth = (
                      sum(
                          growth_values
                      )
                      / len(
                          growth_values
                      )
                  )

                  if avg_growth >= 0.25:
                      growth_score = 15

                  elif avg_growth >= 0.15:
                      growth_score = 13

                  elif avg_growth >= 0.08:
                      growth_score = 10

                  elif avg_growth >= 0.03:
                      growth_score = 7

                  elif avg_growth >= 0:
                      growth_score = 4

                  else:
                      growth_score = 0

              # ==========================================
              # DEĞERLEME /10
              # ==========================================

              valuation_score = previous_component(
                  symbol,
                  "valuation",
                  5
              )

              pe = r.get(
                  "priceToEarningsRatioTTM"
              )

              peg = r.get(
                  "priceToEarningsGrowthRatioTTM"
              )

              if (
                  pe is not None
                  or peg is not None
              ):

                  try:

                      if (
                          peg is not None
                          and float(
                              peg
                          ) > 0
                      ):

                          p = float(
                              peg
                          )

                          if p <= 1:
                              valuation_score = 10

                          elif p <= 1.5:
                              valuation_score = 8

                          elif p <= 2:
                              valuation_score = 6

                          elif p <= 3:
                              valuation_score = 4

                          else:
                              valuation_score = 2

                      elif pe is not None:

                          p = float(
                              pe
                          )

                          if 0 < p <= 20:
                              valuation_score = 9

                          elif 20 < p <= 30:
                              valuation_score = 7

                          elif 30 < p <= 40:
                              valuation_score = 5

                          elif p > 40:
                              valuation_score = 2

                  except Exception:
                      pass

              # ==========================================
              # MOMENTUM /10
              # ==========================================

              momentum_score = previous_component(
                  symbol,
                  "momentum",
                  5
              )

              if change_pct is not None:

                  try:

                      cp = float(
                          change_pct
                      )

                      if cp >= 4:
                          momentum_score = 10

                      elif cp >= 2:
                          momentum_score = 9

                      elif cp >= 1:
                          momentum_score = 8

                      elif cp >= 0:
                          momentum_score = 6

                      elif cp >= -1:
                          momentum_score = 4

                      elif cp >= -2:
                          momentum_score = 2

                      else:
                          momentum_score = 1

                  except Exception:
                      pass

              # ==========================================
              # SEC INSIDER /20
              # ==========================================

              insider = sec_insider(
                  symbol
              )

              insider_score = insider.get(
                  "score"
              )

              # ==========================================
              # KURUMSAL 13F /10
              # ==========================================

              institutional = (
                  institutional_data.get(
                      symbol,
                      {}
                  )
              )

              institutional_score = (
                  institutional.get(
                      "score"
                  )
                  if institutional.get(
                      "status"
                  ) == "ok"
                  else None
              )

              institutional_result = {

                  "score":
                      institutional_score,

                  "max":
                      10,

                  "status":
                      institutional.get(
                          "status",
                          "unavailable"
                      ),

                  "validManagers":
                      institutional.get(
                          "validManagers",
                          0
                      ),

                  "increases":
                      institutional.get(
                          "increases",
                          0
                      ),

                  "decreases":
                      institutional.get(
                          "decreases",
                          0
                      ),

                  "unchanged":
                      institutional.get(
                          "unchanged",
                          0
                      ),

                  "anomaliesExcluded":
                      institutional.get(
                          "anomaliesExcluded",
                          0
                      ),

                  "netShareChange":
                      institutional.get(
                          "netShareChange",
                          0
                      ),

                  "largestIncrease":
                      institutional.get(
                          "largestIncrease"
                      ),

                  "largestDecrease":
                      institutional.get(
                          "largestDecrease"
                      ),

                  "flags":
                      institutional.get(
                          "flags",
                          []
                      ),

                  "managers":
                      institutional.get(
                          "managers",
                          []
                      ),

                  "source":
                      "SEC EDGAR Form 13F-HR"
              }

              # ==========================================
              # TEMEL VERİ FALLBACK
              # ==========================================

              fundamentals = {

                  "revenueGrowth":
                      g.get(
                          "revenueGrowth",
                          previous_fundamentals.get(
                              "revenueGrowth"
                          )
                      ),

                  "netIncomeGrowth":
                      g.get(
                          "netIncomeGrowth",
                          previous_fundamentals.get(
                              "netIncomeGrowth"
                          )
                      ),

                  "epsGrowth":
                      g.get(
                          "epsgrowth",
                          previous_fundamentals.get(
                              "epsGrowth"
                          )
                      ),

                  "pe":
                      pe
                      if pe is not None
                      else previous_fundamentals.get(
                          "pe"
                      ),

                  "peg":
                      peg
                      if peg is not None
                      else previous_fundamentals.get(
                          "peg"
                      )
              }

              analyst = {

                  "targetConsensus":
                      t.get(
                          "targetConsensus",
                          previous_analyst.get(
                              "targetConsensus"
                          )
                      ),

                  "targetHigh":
                      t.get(
                          "targetHigh",
                          previous_analyst.get(
                              "targetHigh"
                          )
                      ),

                  "targetLow":
                      t.get(
                          "targetLow",
                          previous_analyst.get(
                              "targetLow"
                          )
                      ),

                  "targetMedian":
                      t.get(
                          "targetMedian",
                          previous_analyst.get(
                              "targetMedian"
                          )
                      )
              }

              # ==========================================
              # TOPLAM PUAN
              # ==========================================

              base_score = (
                  analyst_score
                  + growth_score
                  + valuation_score
                  + momentum_score
              )

              radar_score = base_score

              radar_max = 50

              if insider_score is not None:

                  radar_score += insider_score

                  radar_max += 20

              if institutional_score is not None:

                  radar_score += (
                      institutional_score
                  )

                  radar_max += 10

              stocks.append({

                  "symbol":
                      symbol,

                  "name":
                      q.get(
                          "name"
                      )
                      or previous_stock.get(
                          "name"
                      ),

                  "price":
                      q.get(
                          "price"
                      ),

                  "change":
                      q.get(
                          "change"
                      ),

                  "changePercentage":
                      q.get(
                          "changePercentage"
                      ),

                  "volume":
                      q.get(
                          "volume"
                      ),

                  "marketCap":
                      q.get(
                          "marketCap"
                      ),

                  "fundamentals":
                      fundamentals,

                  "analyst":
                      analyst,

                  "insider":
                      insider,

                  "institutional":
                      institutional_result,

                  "freshness": {

                      "quote":
                          quote_fresh,

                      "growth":
                          growth_fresh,

                      "ratios":
                          ratios_fresh,

                      "analyst":
                          targets_fresh
                  },

                  "radar": {

                      "score":
                          radar_score,

                      "max":
                          radar_max,

                      "components": {

                          "analyst":
                              analyst_score,

                          "growth":
                              growth_score,

                          "valuation":
                              valuation_score,

                          "momentum":
                              momentum_score,

                          "insider":
                              insider_score,

                          "institutional":
                              institutional_score
                      }
                  }
              })

          # ==============================================
          # ÇIKIŞ
          # ==============================================

          output = {

              "updated_at":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "score_version":
                  "0.6.1",

              "current_score_max":
                  80,

              "universe_size":
                  len(SYMBOLS),

              "quote_status": {

                  "fresh":
                      fresh_quote_count,

                  "cached":
                      cached_quote_count
              },

              "stocks":
                  stocks
          }

          os.makedirs(
              "data",
              exist_ok=True
          )

          with open(
              "data/radar.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "================================"
          )

          print(
              "Radar v0.6.1 tamamlandı"
          )

          print(
              "Hisse sayısı:",
              len(SYMBOLS)
          )

          print(
              "Yeni fiyat:",
              fresh_quote_count
          )

          print(
              "Önbellekten korunan:",
              cached_quote_count
          )

          print(
              "================================"
          )

          PY

