name: Update Radar Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Radar verisini guncelle
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone

          API_KEY = os.environ["FMP_API_KEY"]

          SYMBOLS = [
              "AAPL",
              "MSFT",
              "NVDA",
              "AMZN",
              "GOOGL",
              "META",
              "TSLA"
          ]

          BASE = "https://financialmodelingprep.com/stable"

          def fetch(endpoint, symbol):
              params = urllib.parse.urlencode({
                  "symbol": symbol,
                  "apikey": API_KEY
              })
              url = f"{BASE}/{endpoint}?{params}"

              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "HisseRadar/1.0"}
                  )

                  with urllib.request.urlopen(req, timeout=25) as response:
                      data = json.load(response)

                  if isinstance(data, list):
                      return data[0] if data else {}

                  if isinstance(data, dict):
                      return data

                  return {}

              except Exception as e:
                  print(symbol, endpoint, "ERROR:", e)
                  return {}

          def num(value):
              try:
                  if value is None:
                      return None
                  return float(value)
              except:
                  return None

          def clamp(value, low, high):
              return max(low, min(high, value))

          def growth_score(g):
              revenue = num(
                  g.get("revenueGrowth",
                  g.get("growthRevenue"))
              )

              income = num(
                  g.get("netIncomeGrowth",
                  g.get("growthNetIncome"))
              )

              eps = num(
                  g.get("epsgrowth",
                  g.get("growthEPS"))
              )

              values = [x for x in [revenue, income, eps] if x is not None]

              if not values:
                  return None

              avg = sum(values) / len(values)

              if avg >= 0.25:
                  return 15
              if avg >= 0.15:
                  return 13
              if avg >= 0.08:
                  return 11
              if avg >= 0.03:
                  return 8
              if avg >= 0:
                  return 5
              if avg >= -0.10:
                  return 2
              return 0

          def valuation_score(r):
              pe = num(
                  r.get("priceToEarningsRatioTTM",
                  r.get("priceEarningsRatioTTM"))
              )

              peg = num(
                  r.get("priceToEarningsGrowthRatioTTM",
                  r.get("priceEarningsToGrowthRatioTTM"))
              )

              score = 0
              used = 0

              if pe is not None and pe > 0:
                  used += 1
                  if pe <= 15:
                      score += 5
                  elif pe <= 25:
                      score += 4
                  elif pe <= 35:
                      score += 3
                  elif pe <= 50:
                      score += 2
                  else:
                      score += 1

              if peg is not None and peg > 0:
                  used += 1
                  if peg <= 1:
                      score += 5
                  elif peg <= 1.5:
                      score += 4
                  elif peg <= 2:
                      score += 3
                  elif peg <= 3:
                      score += 2
                  else:
                      score += 1

              if used == 0:
                  return None

              if used == 1:
                  score *= 2

              return int(clamp(score, 0, 10))

          def analyst_score(target, price):
              if not target or not price:
                  return None

              consensus = num(
                  target.get("targetConsensus",
                  target.get("targetMedian",
                  target.get("targetHigh")))
              )

              if consensus is None or price <= 0:
                  return None

              upside = (consensus - price) / price

              if upside >= 0.30:
                  return 15
              if upside >= 0.20:
                  return 13
              if upside >= 0.10:
                  return 10
              if upside >= 0.03:
                  return 7
              if upside >= -0.05:
                  return 4
              return 1

          def momentum_score(q):
              change = num(q.get("changePercentage"))
              volume = num(q.get("volume"))

              if change is None:
                  return None

              score = 5

              if change >= 3:
                  score = 10
              elif change >= 2:
                  score = 9
              elif change >= 1:
                  score = 8
              elif change >= 0:
                  score = 6
              elif change >= -1:
                  score = 4
              elif change >= -2:
                  score = 2
              else:
                  score = 1

              if volume is not None and volume <= 0:
                  score = max(0, score - 1)

              return int(clamp(score, 0, 10))

          stocks = []

          for symbol in SYMBOLS:
              print("Processing:", symbol)

              quote = fetch("quote", symbol)

              if not quote:
                  print(symbol, "quote bulunamadi")
                  continue

              growth = fetch("financial-growth", symbol)
              ratios = fetch("ratios-ttm", symbol)
              targets = fetch("price-target-consensus", symbol)

              price = num(quote.get("price"))

              scores = {
                  "analyst": analyst_score(targets, price),
                  "growth": growth_score(growth),
                  "valuation": valuation_score(ratios),
                  "momentum": momentum_score(quote)
              }

              available_score = sum(
                  x for x in scores.values()
                  if x is not None
              )

              available_max = (
                  (15 if scores["analyst"] is not None else 0) +
                  (15 if scores["growth"] is not None else 0) +
                  (10 if scores["valuation"] is not None else 0) +
                  (10 if scores["momentum"] is not None else 0)
              )

              target_consensus = num(
                  targets.get("targetConsensus",
                  targets.get("targetMedian"))
              )

              stocks.append({
                  "symbol": symbol,
                  "name": quote.get("name"),
                  "price": price,
                  "change": num(quote.get("change")),
                  "changePercentage": num(quote.get("changePercentage")),
                  "volume": quote.get("volume"),
                  "marketCap": quote.get("marketCap"),

                  "radar": {
                      "score": available_score,
                      "max": available_max,
                      "components": scores
                  },

                  "fundamentals": {
                      "revenueGrowth": num(
                          growth.get("revenueGrowth",
                          growth.get("growthRevenue"))
                      ),
                      "netIncomeGrowth": num(
                          growth.get("netIncomeGrowth",
                          growth.get("growthNetIncome"))
                      ),
                      "epsGrowth": num(
                          growth.get("epsgrowth",
                          growth.get("growthEPS"))
                      ),
                      "pe": num(
                          ratios.get("priceToEarningsRatioTTM",
                          ratios.get("priceEarningsRatioTTM"))
                      ),
                      "peg": num(
                          ratios.get("priceToEarningsGrowthRatioTTM",
                          ratios.get("priceEarningsToGrowthRatioTTM"))
                      )
                  },

                  "analyst": {
                      "targetConsensus": target_consensus,
                      "targetHigh": num(targets.get("targetHigh")),
                      "targetLow": num(targets.get("targetLow")),
                      "targetMedian": num(targets.get("targetMedian"))
                  }
              })

          output = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "status": "ok",
              "source": "FMP",
              "score_version": "0.2",
              "current_score_max": 50,
              "stocks": stocks
          }

          os.makedirs("data", exist_ok=True)

          with open("data/radar.json", "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Stocks fetched:", len(stocks))
          PY

      - name: Degisiklikleri kaydet
        run: |
          git config user.name "hisse-radar-bot"
          git config user.email "actions@github.com"
          git add data/radar.json
          git diff --cached --quiet && exit 0
          git commit -m "Radar temel sinyallerini guncelle"
          git push