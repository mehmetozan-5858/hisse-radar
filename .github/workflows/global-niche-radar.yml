name: Global Niche Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Global Niche verilerini güncelle
        run: |
          python <<'PY'
          import os
          import json
          import time
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from urllib.parse import quote

          PATH = "data/global-niche.json"

          CANDIDATES = [
              {
                  "symbol": "RKLB",
                  "name": "Rocket Lab USA, Inc.",
                  "market": "NASDAQ",
                  "country": "USA",
                  "theme": "Space",
                  "size": "small",
                  "score": 68
              },
              {
                  "symbol": "IONQ",
                  "name": "IonQ, Inc.",
                  "market": "NYSE",
                  "country": "USA",
                  "theme": "Quantum",
                  "size": "small",
                  "score": 69
              },
              {
                  "symbol": "SOUN",
                  "name": "SoundHound AI, Inc.",
                  "market": "NASDAQ",
                  "country": "USA",
                  "theme": "AI",
                  "size": "small",
                  "score": 67
              },
              {
                  "symbol": "QBTS",
                  "name": "D-Wave Quantum Inc.",
                  "market": "NYSE",
                  "country": "USA",
                  "theme": "Quantum",
                  "size": "micro",
                  "score": 75
              },
              {
                  "symbol": "LUNR",
                  "name": "Intuitive Machines, Inc.",
                  "market": "NASDAQ",
                  "country": "USA",
                  "theme": "Space",
                  "size": "small",
                  "score": 68
              },
              {
                  "symbol": "PNG.V",
                  "name": "Kraken Robotics Inc.",
                  "market": "TSXV",
                  "country": "Canada",
                  "theme": "Robotics",
                  "size": "micro",
                  "score": 73
              },
              {
                  "symbol": "FLT.TO",
                  "name": "Volatus Aerospace Inc.",
                  "market": "TSX",
                  "country": "Canada",
                  "theme": "Drones",
                  "size": "micro",
                  "score": 73
              },
              {
                  "symbol": "HE1.L",
                  "name": "Helium One Global Ltd",
                  "market": "LSE-AIM",
                  "country": "UK",
                  "theme": "Helium",
                  "size": "micro",
                  "score": 70
              },
              {
                  "symbol": "DRO.AX",
                  "name": "DroneShield Limited",
                  "market": "ASX",
                  "country": "Australia",
                  "theme": "Defense / Drones",
                  "size": "small",
                  "score": 68
              },
              {
                  "symbol": "LTR.AX",
                  "name": "Liontown Resources Limited",
                  "market": "ASX",
                  "country": "Australia",
                  "theme": "Lithium",
                  "size": "small",
                  "score": 63
              },
              {
                  "symbol": "ALQGC.PA",
                  "name": "Quantum Genomics",
                  "market": "Euronext",
                  "country": "France",
                  "theme": "Quantum",
                  "size": "micro",
                  "score": 75
              },
              {
                  "symbol": "MIATK.IS",
                  "name": "MIA Teknoloji A.S.",
                  "market": "BIST",
                  "country": "Türkiye",
                  "theme": "Technology / AI",
                  "size": "small",
                  "score": 67
              },
              {
                  "symbol": "PAPIL.IS",
                  "name": "Papilon Savunma",
                  "market": "BIST",
                  "country": "Türkiye",
                  "theme": "Biometrics / Defense",
                  "size": "micro",
                  "score": 72
              }
          ]

          YAHOO_HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; HisseRadar/2.0)",
              "Accept": "application/json"
          }

          # =========================================================
          # ÖNCEKİ VERİ
          # =========================================================

          previous_map = {}

          try:
              with open(PATH, "r", encoding="utf-8") as f:
                  previous_file = json.load(f)

              previous_map = {
                  item.get("symbol"): item
                  for item in previous_file.get("candidates", [])
                  if item.get("symbol")
              }

              print("Previous Global Niche loaded:", len(previous_map))

          except Exception as e:
              print("Previous Global Niche unavailable:", repr(e))

          # =========================================================
          # HTTP
          # =========================================================

          def get_json(url, headers=None):
              req = Request(url, headers=headers or {})

              with urlopen(req, timeout=30) as response:
                  raw = response.read()

              return json.loads(raw.decode("utf-8"))

          # =========================================================
          # YAHOO - ANA RADARDA ÇALIŞAN FİYAT MOTORU
          # =========================================================

          def yahoo_quote(symbol):
              url = (
                  "https://query1.finance.yahoo.com/v8/finance/chart/"
                  + quote(symbol)
                  + "?interval=1d&range=5d"
              )

              try:
                  data = get_json(url, YAHOO_HEADERS)

                  result = data.get("chart", {}).get("result", [])

                  if not result:
                      print("Yahoo empty result:", symbol)
                      return None

                  item = result[0]
                  meta = item.get("meta", {})

                  quote_data = (
                      item.get("indicators", {})
                          .get("quote", [{}])[0]
                  )

                  closes = quote_data.get("close", [])
                  volumes = quote_data.get("volume", [])
                  highs = quote_data.get("high", [])
                  lows = quote_data.get("low", [])

                  valid = []

                  for i, close_value in enumerate(closes):
                      if close_value is not None:
                          valid.append((i, float(close_value)))

                  if not valid:
                      print("Yahoo no valid close:", symbol)
                      return None

                  last_i, last_price = valid[-1]

                  previous_close = meta.get("chartPreviousClose")

                  if len(valid) >= 2:
                      previous_close = valid[-2][1]

                  change = None
                  change_pct = None

                  if previous_close not in (None, 0):
                      previous_close = float(previous_close)
                      change = last_price - previous_close
                      change_pct = (change / previous_close) * 100

                  volume = (
                      volumes[last_i]
                      if last_i < len(volumes)
                      else None
                  )

                  day_high = (
                      highs[last_i]
                      if last_i < len(highs)
                      else None
                  )

                  day_low = (
                      lows[last_i]
                      if last_i < len(lows)
                      else None
                  )

                  return {
                      "symbol": symbol,
                      "name":
                          meta.get("longName")
                          or meta.get("shortName"),
                      "price": round(last_price, 4),
                      "previousClose":
                          round(previous_close, 4)
                          if previous_close is not None
                          else None,
                      "change":
                          round(change, 4)
                          if change is not None
                          else None,
                      "changePercentage":
                          round(change_pct, 4)
                          if change_pct is not None
                          else None,
                      "volume": volume,
                      "dayLow":
                          round(float(day_low), 4)
                          if day_low is not None
                          else None,
                      "dayHigh":
                          round(float(day_high), 4)
                          if day_high is not None
                          else None,
                      "currency": meta.get("currency"),
                      "exchangeName": meta.get("exchangeName"),
                      "source": "Yahoo Finance chart"
                  }

              except Exception as e:
                  print("Yahoo price error:", symbol, repr(e))
                  return None

          # =========================================================
          # GLOBAL NICHE
          # =========================================================

          output_candidates = []

          fresh_quote_count = 0
          cached_quote_count = 0
          unavailable_count = 0

          for candidate in CANDIDATES:
              symbol = candidate["symbol"]

              print("Processing:", symbol)

              previous = previous_map.get(symbol, {})

              q = yahoo_quote(symbol)

              quote_fresh = bool(
                  q and q.get("price") is not None
              )

              if quote_fresh:
                  fresh_quote_count += 1

                  price = q.get("price")
                  previous_close = q.get("previousClose")
                  change = q.get("change")
                  change_pct = q.get("changePercentage")
                  volume = q.get("volume")
                  day_low = q.get("dayLow")
                  day_high = q.get("dayHigh")
                  currency = q.get("currency")

                  exchange = (
                      q.get("exchangeName")
                      or candidate["market"]
                  )

                  name = (
                      q.get("name")
                      or candidate["name"]
                  )

                  market_status = "fresh"
                  quote_source = "Yahoo Finance chart"

              elif previous.get("price") is not None:
                  cached_quote_count += 1

                  price = previous.get("price")
                  previous_close = previous.get("previousClose")
                  change = previous.get("change")

                  change_pct = (
                      previous.get("changePct")
                      if previous.get("changePct") is not None
                      else previous.get("changePercentage")
                  )

                  volume = previous.get("volume")
                  day_low = previous.get("dayLow")
                  day_high = previous.get("dayHigh")
                  currency = previous.get("currency")

                  exchange = (
                      previous.get("exchange")
                      or candidate["market"]
                  )

                  name = (
                      previous.get("name")
                      or candidate["name"]
                  )

                  market_status = "cached"

                  quote_source = (
                      previous.get("quoteSource")
                      or "cache"
                  )

              else:
                  unavailable_count += 1

                  price = None
                  previous_close = None
                  change = None
                  change_pct = None
                  volume = None
                  day_low = None
                  day_high = None
                  currency = None
                  exchange = candidate["market"]
                  name = candidate["name"]
                  market_status = "unavailable"
                  quote_source = None

              score = candidate["score"]

              if score >= 75:
                  status = "GÜÇLÜ İZLEME"
              else:
                  status = "ADAY"

              output_candidates.append({
                  "symbol": symbol,
                  "name": name,
                  "market": candidate["market"],
                  "country": candidate["country"],
                  "theme": candidate["theme"],
                  "size": candidate["size"],
                  "score": score,
                  "status": status,

                  "price": price,
                  "previousClose": previous_close,
                  "change": change,

                  "changePct": change_pct,
                  "changePercentage": change_pct,

                  "volume": volume,

                  "marketCap": previous.get("marketCap"),

                  "dayLow": day_low,
                  "dayHigh": day_high,

                  "currency": currency,
                  "exchange": exchange,

                  "marketDataAvailable": price is not None,
                  "marketDataStatus": market_status,
                  "quoteSource": quote_source,

                  "freshness": {
                      "quote": quote_fresh
                  }
              })

              time.sleep(0.25)

          # =========================================================
          # PUANA GÖRE SIRALA
          # =========================================================

          output_candidates.sort(
              key=lambda item: (
                  -item.get("score", 0),
                  item.get("symbol", "")
              )
          )

          # =========================================================
          # ÇIKIŞ
          # =========================================================

          output = {
              "version": "global-niche-v7",

              "generatedAt":
                  datetime.now(timezone.utc).isoformat(),

              "count": len(output_candidates),

              "marketDataCount": fresh_quote_count,

              "quoteStatus": {
                  "fresh": fresh_quote_count,
                  "cached": cached_quote_count,
                  "unavailable": unavailable_count
              },

              "quoteProvider":
                  "Yahoo Finance chart / cache fallback",

              "candidates": output_candidates
          }

          os.makedirs("data", exist_ok=True)

          with open(PATH, "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print("Global Niche Radar v7 tamamlandı")
          print("Aday sayısı:", len(CANDIDATES))
          print("Yeni fiyat:", fresh_quote_count)
          print("Önbellekten:", cached_quote_count)
          print("Fiyat bulunamayan:", unavailable_count)
          print("================================")

          for item in output_candidates:
              print(
                  item.get("symbol"),
                  item.get("price"),
                  item.get("currency"),
                  item.get("marketDataStatus")
              )
          PY

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "hisse-radar-bot"
          git config user.email "actions@github.com"

          git add data/global-niche.json

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Update Global Niche Radar v7"
            git push
          fi
