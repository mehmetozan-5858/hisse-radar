name: Global Niche Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "35 5,17 * * *"

permissions:
  contents: write

jobs:
  niche-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Global Niche Radar verisini üret
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          python <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from urllib.parse import quote

          API_KEY = os.environ.get("FMP_API_KEY", "").strip()

          # ============================================
          # GLOBAL NICHE RADAR V2
          # Niş aday puanı + canlı piyasa veri katmanı
          # ============================================

          UNIVERSE = [
              # ABD
              {"symbol": "RKLB", "market": "NASDAQ", "country": "USA",
               "sector": "Space", "size": "small"},
              {"symbol": "IONQ", "market": "NYSE", "country": "USA",
               "sector": "Quantum", "size": "small"},
              {"symbol": "SOUN", "market": "NASDAQ", "country": "USA",
               "sector": "AI", "size": "small"},
              {"symbol": "QBTS", "market": "NYSE", "country": "USA",
               "sector": "Quantum", "size": "micro"},
              {"symbol": "LUNR", "market": "NASDAQ", "country": "USA",
               "sector": "Space", "size": "small"},

              # Kanada
              {"symbol": "PNG.V", "market": "TSXV", "country": "Canada",
               "sector": "Robotics", "size": "micro"},
              {"symbol": "FLT.V", "market": "TSXV", "country": "Canada",
               "sector": "Drones", "size": "micro"},

              # İngiltere
              {"symbol": "HE1.L", "market": "LSE-AIM", "country": "UK",
               "sector": "Helium", "size": "micro"},
              {"symbol": "BMN.L", "market": "LSE-AIM", "country": "UK",
               "sector": "Critical Minerals", "size": "micro"},

              # Avustralya
              {"symbol": "DRO.AX", "market": "ASX", "country": "Australia",
               "sector": "Defense / Drones", "size": "small"},
              {"symbol": "LTR.AX", "market": "ASX", "country": "Australia",
               "sector": "Lithium", "size": "small"},

              # Avrupa
              {"symbol": "ALQGC.PA", "market": "Euronext", "country": "France",
               "sector": "Quantum", "size": "micro"},

              # Türkiye
              {"symbol": "MIATK.IS", "market": "BIST", "country": "Türkiye",
               "sector": "Technology / AI", "size": "small"},
              {"symbol": "PAPIL.IS", "market": "BIST", "country": "Türkiye",
               "sector": "Biometrics / Defense", "size": "micro"},
          ]

          SECTOR_WEIGHT = {
              "AI": 18,
              "Quantum": 20,
              "Space": 19,
              "Robotics": 18,
              "Drones": 18,
              "Defense / Drones": 19,
              "Biometrics / Defense": 17,
              "Technology / AI": 18,
              "Helium": 15,
              "Critical Minerals": 16,
              "Lithium": 14,
          }

          SIZE_WEIGHT = {
              "micro": 20,
              "small": 14,
              "mid": 8,
              "large": 2,
          }

          # Bazı borsalarda FMP sembolü farklı olabileceği için
          # ileride burada ayrı eşleştirme yapabiliriz.
          FMP_SYMBOLS = {
              "RKLB": "RKLB",
              "IONQ": "IONQ",
              "SOUN": "SOUN",
              "QBTS": "QBTS",
              "LUNR": "LUNR",
              "PNG.V": "PNG.V",
              "FLT.V": "FLT.V",
              "HE1.L": "HE1.L",
              "BMN.L": "BMN.L",
              "DRO.AX": "DRO.AX",
              "LTR.AX": "LTR.AX",
              "ALQGC.PA": "ALQGC.PA",
              "MIATK.IS": "MIATK.IS",
              "PAPIL.IS": "PAPIL.IS",
          }

          def safe_float(value):
              try:
                  if value is None:
                      return None
                  return float(value)
              except (TypeError, ValueError):
                  return None

          def safe_int(value):
              try:
                  if value is None:
                      return None
                  return int(float(value))
              except (TypeError, ValueError):
                  return None

          def fetch_quote(symbol):
              if not API_KEY:
                  return None

              fmp_symbol = FMP_SYMBOLS.get(symbol, symbol)

              # FMP stable API quote endpoint.
              url = (
                  "https://financialmodelingprep.com/stable/quote"
                  "?symbol=" + quote(fmp_symbol) +
                  "&apikey=" + quote(API_KEY)
              )

              try:
                  req = Request(
                      url,
                      headers={
                          "User-Agent": "HisseRadar/2.0",
                          "Accept": "application/json"
                      }
                  )

                  with urlopen(req, timeout=20) as response:
                      data = json.loads(
                          response.read().decode("utf-8")
                      )

                  if isinstance(data, list) and data:
                      return data[0]

                  if isinstance(data, dict):
                      # Bazı hata cevapları dict olarak dönebilir.
                      if "price" in data:
                          return data

                  return None

              except Exception as exc:
                  print(
                      f"Fiyat alınamadı: {symbol} -> {exc}"
                  )
                  return None

          results = []

          for stock in UNIVERSE:
              score = 35
              score += SECTOR_WEIGHT.get(
                  stock["sector"], 10
              )
              score += SIZE_WEIGHT.get(
                  stock["size"], 8
              )

              score = max(0, min(100, score))

              if score >= 75:
                  level = "GÜÇLÜ İZLEME"
              elif score >= 65:
                  level = "GÜÇLENİYOR"
              else:
                  level = "NİŞ ADAY"

              quote_data = fetch_quote(
                  stock["symbol"]
              )

              price = None
              change_pct = None
              volume = None
              market_cap = None
              day_low = None
              day_high = None

              if quote_data:
                  price = safe_float(
                      quote_data.get("price")
                  )

                  change_pct = safe_float(
                      quote_data.get(
                          "changePercentage",
                          quote_data.get(
                              "changesPercentage"
                          )
                      )
                  )

                  volume = safe_int(
                      quote_data.get("volume")
                  )

                  market_cap = safe_float(
                      quote_data.get("marketCap")
                  )

                  day_low = safe_float(
                      quote_data.get("dayLow")
                  )

                  day_high = safe_float(
                      quote_data.get("dayHigh")
                  )

              # Hacim sinyali için henüz geçmiş ortalama
              # hacim karşılaştırması yapmıyoruz.
              # Ham hacmi güvenilir şekilde saklıyoruz.
              volume_signal = (
                  "VERİ VAR"
                  if volume is not None
                  else None
              )

              results.append({
                  **stock,
                  "nicheScore": score,
                  "level": level,

                  "price": price,
                  "changePct": change_pct,
                  "volume": volume,
                  "volumeSignal": volume_signal,

                  "marketCap": market_cap,
                  "dayLow": day_low,
                  "dayHigh": day_high,

                  "catalyst": None,

                  "risk": (
                      "Yüksek"
                      if stock["size"] == "micro"
                      else "Orta-Yüksek"
                  ),

                  "scenario100": {
                      "2x": 200,
                      "5x": 500,
                      "10x": 1000,
                      "50x": 5000,
                      "100x": 10000,
                      "1000x": 100000
                  },

                  "marketDataAvailable":
                      price is not None,

                  "note": (
                      "Global Niche Radar araştırma adayı. "
                      "Piyasa verisi mevcutsa FMP üzerinden "
                      "otomatik güncellenir."
                  )
              })

              # API'ye arka arkaya çok sert yük bindirmemek için.
              time.sleep(0.15)

          results.sort(
              key=lambda x: x["nicheScore"],
              reverse=True
          )

          available_count = sum(
              1 for x in results
              if x["marketDataAvailable"]
          )

          payload = {
              "version": "global-niche-v2",
              "generatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "description":
                  "Global erken keşif radarı ve piyasa veri katmanı.",

              "disclaimer": (
                  "Niche Score bir getiri tahmini değildir. "
                  "Yüksek riskli şirketleri araştırma amacıyla "
                  "önceliklendirir."
              ),

              "markets": sorted(
                  list(
                      set(
                          x["market"]
                          for x in results
                      )
                  )
              ),

              "count": len(results),

              "marketDataCount":
                  available_count,

              "stocks": results
          }

          os.makedirs(
              "data",
              exist_ok=True
          )

          with open(
              "data/global-niche.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  payload,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Global Niche Radar V2 üretildi."
          )
          print(
              "Aday sayısı:",
              len(results)
          )
          print(
              "Fiyat verisi bulunan:",
              available_count
          )
          print(
              "Fiyat verisi bulunamayan:",
              len(results) - available_count
          )
          PY

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "actions-user"
          git config user.email "actions@users.noreply.github.com"

          git add data/global-niche.json

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Update Global Niche Radar V2"
            git push
          fi
