name: Global Niche Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Global Niche verilerini güncelle
        run: |
          python <<'PY'
          import json
          import time
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from urllib.parse import quote

          PATH = "data/global-niche.json"

          CANDIDATES = [
              {
                  "symbol": "RKLB",
                  "name": "Rocket Lab USA, Inc.",
                  "market": "NASDAQ",
                  "country": "USA",
                  "theme": "Space",
                  "size": "small",
                  "score": 68,
              },
              {
                  "symbol": "IONQ",
                  "name": "IonQ, Inc.",
                  "market": "NYSE",
                  "country": "USA",
                  "theme": "Quantum",
                  "size": "small",
                  "score": 69,
              },
              {
                  "symbol": "SOUN",
                  "name": "SoundHound AI, Inc.",
                  "market": "NASDAQ",
                  "country": "USA",
                  "theme": "AI",
                  "size": "small",
                  "score": 67,
              },
              {
                  "symbol": "QBTS",
                  "name": "D-Wave Quantum Inc.",
                  "market": "NYSE",
                  "country": "USA",
                  "theme": "Quantum",
                  "size": "micro",
                  "score": 75,
              },
              {
                  "symbol": "LUNR",
                  "name": "Intuitive Machines, Inc.",
                  "market": "NASDAQ",
                  "country": "USA",
                  "theme": "Space",
                  "size": "small",
                  "score": 68,
              },
              {
                  "symbol": "PNG.V",
                  "name": "Kraken Robotics Inc.",
                  "market": "TSXV",
                  "country": "Canada",
                  "theme": "Robotics",
                  "size": "micro",
                  "score": 73,
              },
              {
                  "symbol": "FLT.V",
                  "name": "Volatus Aerospace Inc.",
                  "market": "TSXV",
                  "country": "Canada",
                  "theme": "Drones",
                  "size": "micro",
                  "score": 73,
              },
              {
                  "symbol": "HE1.L",
                  "name": "Helium One Global Ltd",
                  "market": "LSE-AIM",
                  "country": "UK",
                  "theme": "Helium",
                  "size": "micro",
                  "score": 70,
              },
              {
                  "symbol": "BMN.L",
                  "name": "Bushveld Minerals Limited",
                  "market": "LSE-AIM",
                  "country": "UK",
                  "theme": "Critical Minerals",
                  "size": "micro",
                  "score": 71,
              },
              {
                  "symbol": "DRO.AX",
                  "name": "DroneShield Limited",
                  "market": "ASX",
                  "country": "Australia",
                  "theme": "Defense / Drones",
                  "size": "small",
                  "score": 68,
              },
              {
                  "symbol": "LTR.AX",
                  "name": "Liontown Resources Limited",
                  "market": "ASX",
                  "country": "Australia",
                  "theme": "Lithium",
                  "size": "small",
                  "score": 63,
              },
              {
                  "symbol": "ALQGC.PA",
                  "name": "Quantum Genomics",
                  "market": "Euronext",
                  "country": "France",
                  "theme": "Quantum",
                  "size": "micro",
                  "score": 75,
              },
              {
                  "symbol": "MIATK.IS",
                  "name": "MIA Teknoloji A.S.",
                  "market": "BIST",
                  "country": "Türkiye",
                  "theme": "Technology / AI",
                  "size": "small",
                  "score": 67,
              },
              {
                  "symbol": "PAPIL.IS",
                  "name": "Papilon Savunma",
                  "market": "BIST",
                  "country": "Türkiye",
                  "theme": "Biometrics / Defense",
                  "size": "micro",
                  "score": 72,
              },
          ]

          def num(value):
              try:
                  if value is None:
                      return None
                  return float(value)
              except Exception:
                  return None

          # Eski veriyi cache olarak sakla
          previous_map = {}

          try:
              with open(PATH, "r", encoding="utf-8") as f:
                  previous = json.load(f)

              for item in previous.get("candidates", []):
                  symbol = item.get("symbol")
                  if symbol:
                      previous_map[symbol] = item

          except Exception as exc:
              print("Eski JSON okunamadı:", exc)

          # ==========================================================
          # YAHOO - TEK TOPLU İSTEK
          # 14 ayrı bağlantı yerine bütün semboller tek istekte.
          # ==========================================================

          symbols = ",".join(
              candidate["symbol"]
              for candidate in CANDIDATES
          )

          yahoo_url = (
              "https://query1.finance.yahoo.com/v7/finance/quote"
              "?symbols=" + quote(symbols, safe=",.")
          )

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/124.0.0.0 Safari/537.36"
              ),
              "Accept": "application/json,text/plain,*/*",
              "Accept-Language": "en-US,en;q=0.9",
          }

          yahoo_map = {}
          yahoo_error = None

          for attempt in range(1, 4):
              try:
                  print(
                      f"Yahoo toplu fiyat isteği "
                      f"deneme {attempt}/3"
                  )

                  request = Request(
                      yahoo_url,
                      headers=headers
                  )

                  with urlopen(
                      request,
                      timeout=30
                  ) as response:
                      payload = json.loads(
                          response.read().decode(
                              "utf-8"
                          )
                      )

                  results = (
                      payload
                      .get("quoteResponse", {})
                      .get("result", [])
                  )

                  for result in results:
                      symbol = result.get("symbol")

                      if symbol:
                          yahoo_map[symbol] = result

                  print(
                      "Yahoo toplu cevap:",
                      len(yahoo_map),
                      "sembol"
                  )

                  if yahoo_map:
                      break

              except Exception as exc:
                  yahoo_error = str(exc)
                  print(
                      "Yahoo toplu istek hatası:",
                      yahoo_error
                  )

                  if attempt < 3:
                      time.sleep(8 * attempt)

          fresh = 0
          cached = 0
          unavailable = 0

          output_candidates = []

          for candidate in CANDIDATES:
              symbol = candidate["symbol"]

              raw = yahoo_map.get(symbol, {})
              old = previous_map.get(symbol, {})

              price = num(
                  raw.get("regularMarketPrice")
              )

              previous_close = num(
                  raw.get(
                      "regularMarketPreviousClose"
                  )
              )

              change = num(
                  raw.get("regularMarketChange")
              )

              change_pct = num(
                  raw.get(
                      "regularMarketChangePercent"
                  )
              )

              volume = num(
                  raw.get("regularMarketVolume")
              )

              day_low = num(
                  raw.get("regularMarketDayLow")
              )

              day_high = num(
                  raw.get("regularMarketDayHigh")
              )

              market_cap = num(
                  raw.get("marketCap")
              )

              currency = raw.get("currency")

              exchange = (
                  raw.get("fullExchangeName")
                  or raw.get("exchange")
                  or candidate["market"]
              )

              yahoo_name = (
                  raw.get("longName")
                  or raw.get("shortName")
              )

              if price is not None:
                  fresh += 1
                  market_status = "fresh"
                  source = "Yahoo Finance batch"

              elif old.get("price") is not None:
                  cached += 1
                  market_status = "cached"
                  source = (
                      old.get("quoteSource")
                      or "previous cache"
                  )

                  price = old.get("price")
                  previous_close = old.get(
                      "previousClose"
                  )
                  change = old.get("change")
                  change_pct = old.get(
                      "changePct",
                      old.get(
                          "changePercentage"
                      )
                  )
                  volume = old.get("volume")
                  day_low = old.get("dayLow")
                  day_high = old.get("dayHigh")
                  market_cap = old.get(
                      "marketCap"
                  )
                  currency = old.get("currency")
                  exchange = (
                      old.get("exchange")
                      or candidate["market"]
                  )

              else:
                  unavailable += 1
                  market_status = "unavailable"
                  source = None

              item = {
                  "symbol": symbol,
                  "name": (
                      yahoo_name
                      or candidate["name"]
                  ),
                  "market": candidate["market"],
                  "country": candidate["country"],
                  "theme": candidate["theme"],
                  "size": candidate["size"],
                  "score": candidate["score"],
                  "status": (
                      "GÜÇLÜ İZLEME"
                      if candidate["score"] >= 75
                      else "ADAY"
                  ),
                  "price": (
                      round(float(price), 4)
                      if price is not None
                      else None
                  ),
                  "previousClose": (
                      round(
                          float(previous_close),
                          4
                      )
                      if previous_close is not None
                      else None
                  ),
                  "change": (
                      round(float(change), 4)
                      if change is not None
                      else None
                  ),
                  "changePct": (
                      round(
                          float(change_pct),
                          2
                      )
                      if change_pct is not None
                      else None
                  ),
                  "changePercentage": (
                      round(
                          float(change_pct),
                          2
                      )
                      if change_pct is not None
                      else None
                  ),
                  "volume": (
                      int(float(volume))
                      if volume is not None
                      else None
                  ),
                  "marketCap": (
                      int(float(market_cap))
                      if market_cap is not None
                      else None
                  ),
                  "dayLow": (
                      round(float(day_low), 4)
                      if day_low is not None
                      else None
                  ),
                  "dayHigh": (
                      round(float(day_high), 4)
                      if day_high is not None
                      else None
                  ),
                  "currency": currency,
                  "exchange": exchange,
                  "marketDataAvailable": (
                      price is not None
                  ),
                  "marketDataStatus": (
                      market_status
                  ),
                  "quoteSource": source,
              }

              output_candidates.append(item)

          output_candidates.sort(
              key=lambda item: (
                  -item.get("score", 0),
                  item.get("symbol", "")
              )
          )

          output = {
              "version": "global-niche-v5",
              "generatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),
              "count": len(output_candidates),
              "marketDataCount": fresh,
              "quoteStatus": {
                  "fresh": fresh,
                  "cached": cached,
                  "unavailable": unavailable,
              },
              "quoteProvider": (
                  "Yahoo Finance batch / cache fallback"
              ),
              "lastQuoteError": yahoo_error,
              "candidates": output_candidates,
          }

          with open(
              PATH,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print(
              "===================================="
          )
          print(
              "GLOBAL NICHE RADAR v5 TAMAMLANDI"
          )
          print(
              "===================================="
          )
          print(
              "Toplam aday:",
              len(output_candidates)
          )
          print("Taze fiyat:", fresh)
          print("Cache fiyat:", cached)
          print(
              "Fiyat bulunamayan:",
              unavailable
          )

          if yahoo_error:
              print(
                  "Son Yahoo hatası:",
                  yahoo_error
              )

          for item in output_candidates:
              print(
                  item["symbol"],
                  item["price"],
                  item["currency"],
                  item["marketDataStatus"]
              )
          PY

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"

          git add data/global-niche.json

          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
          else
            git commit -m "Update Global Niche Radar v5"
            git push
          fi
