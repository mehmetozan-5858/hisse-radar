name: Global Niche Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Global Niş verilerini güncelle
        run: |
          python <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from urllib.parse import quote

          # =========================================================
          # GLOBAL NİŞ EVRENİ
          # =========================================================

          CANDIDATES = [
              {
                  "symbol": "RKLB",
                  "market": "NASDAQ",
                  "country": "USA",
                  "theme": "Space",
                  "size": "small",
                  "score": 68
              },
              {
                  "symbol": "IONQ",
                  "market": "NYSE",
                  "country": "USA",
                  "theme": "Quantum",
                  "size": "small",
                  "score": 69
              },
              {
                  "symbol": "SOUN",
                  "market": "NASDAQ",
                  "country": "USA",
                  "theme": "AI",
                  "size": "small",
                  "score": 67
              },
              {
                  "symbol": "QBTS",
                  "market": "NYSE",
                  "country": "USA",
                  "theme": "Quantum",
                  "size": "micro",
                  "score": 75
              },
              {
                  "symbol": "LUNR",
                  "market": "NASDAQ",
                  "country": "USA",
                  "theme": "Space",
                  "size": "small",
                  "score": 68
              },
              {
                  "symbol": "PNG.V",
                  "market": "TSXV",
                  "country": "Canada",
                  "theme": "Robotics",
                  "size": "micro",
                  "score": 73
              },
              {
                  "symbol": "FLT.V",
                  "market": "TSXV",
                  "country": "Canada",
                  "theme": "Drones",
                  "size": "micro",
                  "score": 73
              },
              {
                  "symbol": "HE1.L",
                  "market": "LSE-AIM",
                  "country": "UK",
                  "theme": "Helium",
                  "size": "micro",
                  "score": 70
              },
              {
                  "symbol": "BMN.L",
                  "market": "LSE-AIM",
                  "country": "UK",
                  "theme": "Critical Minerals",
                  "size": "micro",
                  "score": 71
              },
              {
                  "symbol": "DRO.AX",
                  "market": "ASX",
                  "country": "Australia",
                  "theme": "Defense / Drones",
                  "size": "small",
                  "score": 68
              },
              {
                  "symbol": "LTR.AX",
                  "market": "ASX",
                  "country": "Australia",
                  "theme": "Lithium",
                  "size": "small",
                  "score": 63
              },
              {
                  "symbol": "ALQGC.PA",
                  "market": "Euronext",
                  "country": "France",
                  "theme": "Quantum",
                  "size": "micro",
                  "score": 75
              },
              {
                  "symbol": "MIATK.IS",
                  "market": "BIST",
                  "country": "Türkiye",
                  "theme": "Technology / AI",
                  "size": "small",
                  "score": 67
              },
              {
                  "symbol": "PAPIL.IS",
                  "market": "BIST",
                  "country": "Türkiye",
                  "theme": "Biometrics / Defense",
                  "size": "micro",
                  "score": 72
              }
          ]

          # =========================================================
          # ÖNCEKİ VERİ
          # =========================================================

          previous_map = {}

          try:
              with open(
                  "data/global-niche.json",
                  "r",
                  encoding="utf-8"
              ) as f:
                  previous_file = json.load(f)

              old_candidates = (
                  previous_file.get("candidates")
                  or previous_file.get("stocks")
                  or []
              )

              previous_map = {
                  x.get("symbol"): x
                  for x in old_candidates
                  if x.get("symbol")
              }

              print(
                  "Previous Global Niche loaded:",
                  len(previous_map)
              )

          except Exception as e:
              print(
                  "Previous Global Niche unavailable:",
                  repr(e)
              )

          # =========================================================
          # YAHOO FINANCE
          # =========================================================

          HEADERS = {
              "User-Agent":
                  "Mozilla/5.0 (compatible; HisseRadar/2.0)",
              "Accept": "application/json"
          }

          def get_json(url):
              req = Request(
                  url,
                  headers=HEADERS
              )

              with urlopen(
                  req,
                  timeout=30
              ) as response:
                  raw = response.read()

              return json.loads(
                  raw.decode("utf-8")
              )

          def yahoo_quote(symbol):
              url = (
                  "https://query1.finance.yahoo.com/"
                  "v8/finance/chart/"
                  + quote(symbol)
                  + "?interval=1d&range=5d"
              )

              try:
                  data = get_json(url)

                  result = (
                      data.get("chart", {})
                          .get("result", [])
                  )

                  if not result:
                      return None

                  item = result[0]
                  meta = item.get("meta", {})

                  quote_data = (
                      item.get("indicators", {})
                          .get("quote", [{}])[0]
                  )

                  closes = quote_data.get(
                      "close",
                      []
                  )

                  volumes = quote_data.get(
                      "volume",
                      []
                  )

                  valid = []

                  for i, value in enumerate(closes):
                      if value is not None:
                          valid.append(
                              (i, float(value))
                          )

                  if not valid:
                      return None

                  last_index, price = valid[-1]

                  previous_close = (
                      meta.get("chartPreviousClose")
                  )

                  if len(valid) >= 2:
                      previous_close = valid[-2][1]

                  change = None
                  change_pct = None

                  if previous_close not in (
                      None,
                      0
                  ):
                      previous_close = float(
                          previous_close
                      )

                      change = (
                          price
                          - previous_close
                      )

                      change_pct = (
                          change
                          / previous_close
                          * 100
                      )

                  volume = None

                  if last_index < len(volumes):
                      volume = volumes[last_index]

                  day_low = meta.get(
                      "regularMarketDayLow"
                  )

                  day_high = meta.get(
                      "regularMarketDayHigh"
                  )

                  return {
                      "name":
                          meta.get("longName")
                          or meta.get("shortName"),

                      "price":
                          round(price, 4),

                      "change":
                          round(change, 4)
                          if change is not None
                          else None,

                      "changePct":
                          round(change_pct, 4)
                          if change_pct is not None
                          else None,

                      "volume": volume,

                      "marketCap": None,

                      "dayLow": day_low,

                      "dayHigh": day_high,

                      "currency":
                          meta.get("currency"),

                      "exchange":
                          meta.get("exchangeName"),

                      "marketDataAvailable": True,

                      "quoteSource":
                          "Yahoo Finance chart"
                  }

              except Exception as e:
                  print(
                      "Yahoo error:",
                      symbol,
                      repr(e)
                  )

                  return None

          # =========================================================
          # ADAYLARI GÜNCELLE
          # =========================================================

          output_candidates = []

          fresh_count = 0
          cached_count = 0

          for candidate in CANDIDATES:
              symbol = candidate["symbol"]

              print(
                  "Global Niche processing:",
                  symbol
              )

              old = previous_map.get(
                  symbol,
                  {}
              )

              q = yahoo_quote(symbol)

              fresh = bool(
                  q
                  and q.get("price") is not None
              )

              if fresh:
                  fresh_count += 1

              else:
                  cached_count += 1

                  old_price = old.get("price")

                  q = {
                      "name":
                          old.get("name"),

                      "price":
                          old_price,

                      "change":
                          old.get("change"),

                      "changePct":
                          old.get(
                              "changePct",
                              old.get(
                                  "changePercentage"
                              )
                          ),

                      "volume":
                          old.get("volume"),

                      "marketCap":
                          old.get("marketCap"),

                      "dayLow":
                          old.get("dayLow"),

                      "dayHigh":
                          old.get("dayHigh"),

                      "currency":
                          old.get("currency"),

                      "exchange":
                          old.get("exchange"),

                      "marketDataAvailable":
                          old_price is not None,

                      "quoteSource":
                          "cache"
                  }

              score = candidate["score"]

              if score >= 75:
                  signal = "GÜÇLÜ İZLEME"
              elif score >= 65:
                  signal = "ADAY"
              else:
                  signal = "İZLEME"

              item = {
                  "symbol": symbol,

                  "name":
                      q.get("name")
                      or old.get("name"),

                  "market":
                      candidate["market"],

                  "country":
                      candidate["country"],

                  "theme":
                      candidate["theme"],

                  "size":
                      candidate["size"],

                  "score": score,

                  "signal": signal,

                  "price":
                      q.get("price"),

                  "change":
                      q.get("change"),

                  "changePct":
                      q.get("changePct"),

                  "volume":
                      q.get("volume"),

                  "marketCap":
                      q.get("marketCap")
                      or old.get("marketCap"),

                  "dayLow":
                      q.get("dayLow"),

                  "dayHigh":
                      q.get("dayHigh"),

                  "currency":
                      q.get("currency"),

                  "exchange":
                      q.get("exchange"),

                  "marketDataAvailable":
                      q.get(
                          "marketDataAvailable",
                          False
                      ),

                  "quoteSource":
                      q.get("quoteSource"),

                  "fresh":
                      fresh
              }

              output_candidates.append(
                  item
              )

              time.sleep(0.25)

          # =========================================================
          # PUANA GÖRE SIRALA
          # =========================================================

          output_candidates.sort(
              key=lambda x: (
                  x.get("score", 0),
                  x.get("symbol", "")
              ),
              reverse=True
          )

          # =========================================================
          # JSON ÇIKIŞI
          # =========================================================

          output = {
              "version":
                  "global-niche-v3",

              "generatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "count":
                  len(output_candidates),

              "marketDataCount":
                  fresh_count,

              "quoteStatus": {
                  "fresh":
                      fresh_count,

                  "cached":
                      cached_count
              },

              "quoteProvider":
                  "Yahoo Finance chart / cache fallback",

              "candidates":
                  output_candidates
          }

          os.makedirs(
              "data",
              exist_ok=True
          )

          with open(
              "data/global-niche.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "================================"
          )

          print(
              "Global Niche v3 tamamlandı"
          )

          print(
              "Aday:",
              len(output_candidates)
          )

          print(
              "Yeni fiyat:",
              fresh_count
          )

          print(
              "Cache:",
              cached_count
          )

          print(
              "================================"
          )
          PY

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "hisse-radar-bot"
          git config user.email "actions@github.com"

          git add data/global-niche.json

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Update Global Niche Radar v3 with independent quotes"
            git push
          fi
