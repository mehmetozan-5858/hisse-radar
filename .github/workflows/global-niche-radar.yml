name: Global Niche Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Global Niche verilerini güncelle
        run: |
          python <<'PY'
          import csv
          import io
          import json
          import time
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from urllib.parse import quote

          PATH = "data/global-niche.json"

          # ---------------------------------------------------------
          # ADAYLAR
          # stooq = Stooq üzerinde denenecek sembol
          # ---------------------------------------------------------

          CANDIDATES = [
              {
                  "symbol": "RKLB",
                  "stooq": "RKLB.US",
                  "name": "Rocket Lab USA, Inc.",
                  "market": "NASDAQ",
                  "country": "USA",
                  "theme": "Space",
                  "size": "small",
                  "score": 68,
              },
              {
                  "symbol": "IONQ",
                  "stooq": "IONQ.US",
                  "name": "IonQ, Inc.",
                  "market": "NYSE",
                  "country": "USA",
                  "theme": "Quantum",
                  "size": "small",
                  "score": 69,
              },
              {
                  "symbol": "SOUN",
                  "stooq": "SOUN.US",
                  "name": "SoundHound AI, Inc.",
                  "market": "NASDAQ",
                  "country": "USA",
                  "theme": "AI",
                  "size": "small",
                  "score": 67,
              },
              {
                  "symbol": "QBTS",
                  "stooq": "QBTS.US",
                  "name": "D-Wave Quantum Inc.",
                  "market": "NYSE",
                  "country": "USA",
                  "theme": "Quantum",
                  "size": "micro",
                  "score": 75,
              },
              {
                  "symbol": "LUNR",
                  "stooq": "LUNR.US",
                  "name": "Intuitive Machines, Inc.",
                  "market": "NASDAQ",
                  "country": "USA",
                  "theme": "Space",
                  "size": "small",
                  "score": 68,
              },
              {
                  "symbol": "PNG.V",
                  "stooq": None,
                  "name": "Kraken Robotics Inc.",
                  "market": "TSXV",
                  "country": "Canada",
                  "theme": "Robotics",
                  "size": "micro",
                  "score": 73,
              },
              {
                  "symbol": "FLT.V",
                  "stooq": None,
                  "name": "Volatus Aerospace Inc.",
                  "market": "TSXV",
                  "country": "Canada",
                  "theme": "Drones",
                  "size": "micro",
                  "score": 73,
              },
              {
                  "symbol": "HE1.L",
                  "stooq": None,
                  "name": "Helium One Global Ltd",
                  "market": "LSE-AIM",
                  "country": "UK",
                  "theme": "Helium",
                  "size": "micro",
                  "score": 70,
              },
              {
                  "symbol": "BMN.L",
                  "stooq": None,
                  "name": "Bushveld Minerals Limited",
                  "market": "LSE-AIM",
                  "country": "UK",
                  "theme": "Critical Minerals",
                  "size": "micro",
                  "score": 71,
              },
              {
                  "symbol": "DRO.AX",
                  "stooq": None,
                  "name": "DroneShield Limited",
                  "market": "ASX",
                  "country": "Australia",
                  "theme": "Defense / Drones",
                  "size": "small",
                  "score": 68,
              },
              {
                  "symbol": "LTR.AX",
                  "stooq": None,
                  "name": "Liontown Resources Limited",
                  "market": "ASX",
                  "country": "Australia",
                  "theme": "Lithium",
                  "size": "small",
                  "score": 63,
              },
              {
                  "symbol": "ALQGC.PA",
                  "stooq": None,
                  "name": "Quantum Genomics",
                  "market": "Euronext",
                  "country": "France",
                  "theme": "Quantum",
                  "size": "micro",
                  "score": 75,
              },
              {
                  "symbol": "MIATK.IS",
                  "stooq": None,
                  "name": "MIA Teknoloji A.S.",
                  "market": "BIST",
                  "country": "Türkiye",
                  "theme": "Technology / AI",
                  "size": "small",
                  "score": 67,
              },
              {
                  "symbol": "PAPIL.IS",
                  "stooq": None,
                  "name": "Papilon Savunma",
                  "market": "BIST",
                  "country": "Türkiye",
                  "theme": "Biometrics / Defense",
                  "size": "micro",
                  "score": 72,
              },
          ]

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "text/csv,text/plain,*/*",
          }

          def number(value):
              try:
                  if value in (None, "", "N/D", "-"):
                      return None
                  return float(value)
              except Exception:
                  return None

          # ---------------------------------------------------------
          # ESKİ DOSYA
          # ---------------------------------------------------------

          previous_map = {}

          try:
              with open(PATH, "r", encoding="utf-8") as f:
                  old = json.load(f)

              for item in old.get("candidates", []):
                  symbol = item.get("symbol")

                  if symbol:
                      previous_map[symbol] = item

          except Exception as exc:
              print("Eski veri okunamadı:", exc)

          # ---------------------------------------------------------
          # STOOQ
          # Her ABD hissesi için yalnızca tek günlük CSV.
          # Yahoo ve FMP kullanılmıyor.
          # ---------------------------------------------------------

          def fetch_stooq(symbol):
              s = symbol.lower()

              url = (
                  "https://stooq.com/q/l/"
                  f"?s={quote(s)}&f=sd2t2ohlcv&h&e=csv"
              )

              req = Request(url, headers=HEADERS)

              with urlopen(req, timeout=20) as response:
                  text = response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

              rows = list(
                  csv.DictReader(io.StringIO(text))
              )

              if not rows:
                  raise RuntimeError("CSV boş")

              row = rows[0]

              close = number(row.get("Close"))
              open_price = number(row.get("Open"))
              high = number(row.get("High"))
              low = number(row.get("Low"))
              volume = number(row.get("Volume"))

              if close is None:
                  raise RuntimeError(
                      f"Fiyat yok: {row}"
                  )

              return {
                  "price": close,
                  "open": open_price,
                  "dayHigh": high,
                  "dayLow": low,
                  "volume": volume,
              }

          # ---------------------------------------------------------
          # VERİLERİ OLUŞTUR
          # ---------------------------------------------------------

          output_candidates = []

          fresh = 0
          cached = 0
          unavailable = 0

          for candidate in CANDIDATES:
              symbol = candidate["symbol"]
              previous = previous_map.get(symbol, {})

              market = None
              source = None

              stooq_symbol = candidate.get("stooq")

              if stooq_symbol:
                  try:
                      print(
                          f"Stooq fiyat isteği: "
                          f"{symbol} -> {stooq_symbol}"
                      )

                      market = fetch_stooq(
                          stooq_symbol
                      )

                      source = "Stooq"
                      fresh += 1

                      print(
                          f"  OK {symbol}: "
                          f"{market['price']}"
                      )

                  except Exception as exc:
                      print(
                          f"  Stooq hata {symbol}: "
                          f"{exc}"
                      )

              if market is not None:
                  price = market.get("price")
                  open_price = market.get("open")

                  change = None
                  change_pct = None

                  if (
                      price is not None
                      and open_price is not None
                      and open_price != 0
                  ):
                      change = price - open_price
                      change_pct = (
                          change / open_price
                      ) * 100

                  status = "fresh"

                  item = {
                      "symbol": symbol,
                      "name": candidate["name"],
                      "market": candidate["market"],
                      "country": candidate["country"],
                      "theme": candidate["theme"],
                      "size": candidate["size"],
                      "score": candidate["score"],
                      "status": (
                          "GÜÇLÜ İZLEME"
                          if candidate["score"] >= 75
                          else "ADAY"
                      ),
                      "price": round(price, 4),
                      "previousClose": None,
                      "change": (
                          round(change, 4)
                          if change is not None
                          else None
                      ),
                      "changePct": (
                          round(change_pct, 2)
                          if change_pct is not None
                          else None
                      ),
                      "changePercentage": (
                          round(change_pct, 2)
                          if change_pct is not None
                          else None
                      ),
                      "volume": (
                          int(market["volume"])
                          if market.get("volume")
                          is not None
                          else None
                      ),
                      "marketCap": previous.get(
                          "marketCap"
                      ),
                      "dayLow": market.get(
                          "dayLow"
                      ),
                      "dayHigh": market.get(
                          "dayHigh"
                      ),
                      "currency": "USD",
                      "exchange": candidate[
                          "market"
                      ],
                      "marketDataAvailable": True,
                      "marketDataStatus": status,
                      "quoteSource": source,
                  }

              elif previous.get("price") is not None:
                  cached += 1

                  item = dict(previous)

                  item.update({
                      "symbol": symbol,
                      "name": candidate["name"],
                      "market": candidate["market"],
                      "country": candidate["country"],
                      "theme": candidate["theme"],
                      "size": candidate["size"],
                      "score": candidate["score"],
                      "marketDataAvailable": True,
                      "marketDataStatus": "cached",
                      "quoteSource": (
                          previous.get(
                              "quoteSource"
                          )
                          or "previous cache"
                      ),
                  })

              else:
                  unavailable += 1

                  item = {
                      "symbol": symbol,
                      "name": candidate["name"],
                      "market": candidate["market"],
                      "country": candidate["country"],
                      "theme": candidate["theme"],
                      "size": candidate["size"],
                      "score": candidate["score"],
                      "status": (
                          "GÜÇLÜ İZLEME"
                          if candidate["score"] >= 75
                          else "ADAY"
                      ),
                      "price": None,
                      "previousClose": None,
                      "change": None,
                      "changePct": None,
                      "changePercentage": None,
                      "volume": None,
                      "marketCap": None,
                      "dayLow": None,
                      "dayHigh": None,
                      "currency": None,
                      "exchange": candidate[
                          "market"
                      ],
                      "marketDataAvailable": False,
                      "marketDataStatus": (
                          "unavailable"
                      ),
                      "quoteSource": None,
                  }

              output_candidates.append(item)

              time.sleep(0.25)

          output_candidates.sort(
              key=lambda x: (
                  -x.get("score", 0),
                  x.get("symbol", "")
              )
          )

          output = {
              "version": "global-niche-v4",
              "generatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),
              "count": len(output_candidates),
              "marketDataCount": fresh,
              "quoteStatus": {
                  "fresh": fresh,
                  "cached": cached,
                  "unavailable": unavailable,
              },
              "quoteProvider": (
                  "Stooq / previous cache"
              ),
              "candidates": output_candidates,
          }

          with open(
              PATH,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print(
              "=================================="
          )
          print(
              "GLOBAL NICHE RADAR v4 TAMAMLANDI"
          )
          print(
              "=================================="
          )
          print("Toplam aday:", len(output_candidates))
          print("Taze fiyat:", fresh)
          print("Cache fiyat:", cached)
          print("Fiyat bulunamayan:", unavailable)

          for item in output_candidates:
              print(
                  item["symbol"],
                  item.get("price"),
                  item.get("currency"),
                  item.get("marketDataStatus"),
                  item.get("quoteSource"),
              )
          PY

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"

          git add data/global-niche.json

          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
          else
            git commit -m "Update Global Niche Radar v4"
            git push
          fi
