name: Global Niche Radar V10

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Global Niche V10 verilerini güncelle
        run: |
          python <<'PY'
          import os
          import json
          import time
          import statistics
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from urllib.parse import quote

          PATH = "data/global-niche.json"

          CANDIDATES = [
              {"symbol":"RKLB","name":"Rocket Lab USA, Inc.","market":"NASDAQ","country":"USA","theme":"Space","size":"small"},
              {"symbol":"IONQ","name":"IonQ, Inc.","market":"NYSE","country":"USA","theme":"Quantum","size":"small"},
              {"symbol":"SOUN","name":"SoundHound AI, Inc.","market":"NASDAQ","country":"USA","theme":"AI","size":"small"},
              {"symbol":"QBTS","name":"D-Wave Quantum Inc.","market":"NYSE","country":"USA","theme":"Quantum","size":"micro"},
              {"symbol":"LUNR","name":"Intuitive Machines, Inc.","market":"NASDAQ","country":"USA","theme":"Space","size":"small"},
              {"symbol":"PNG.V","name":"Kraken Robotics Inc.","market":"TSXV","country":"Canada","theme":"Robotics","size":"micro"},
              {"symbol":"FLT.TO","name":"Volatus Aerospace Inc.","market":"TSX","country":"Canada","theme":"Drones","size":"micro"},
              {"symbol":"HE1.L","name":"Helium One Global Ltd","market":"LSE-AIM","country":"UK","theme":"Helium","size":"micro"},
              {"symbol":"DRO.AX","name":"DroneShield Limited","market":"ASX","country":"Australia","theme":"Defense / Drones","size":"small"},
              {"symbol":"LTR.AX","name":"Liontown Resources Limited","market":"ASX","country":"Australia","theme":"Lithium","size":"small"},
              {"symbol":"ALQGC.PA","name":"Quantum Genomics","market":"Euronext","country":"France","theme":"Quantum","size":"micro"},
              {"symbol":"MIATK.IS","name":"MIA Teknoloji A.S.","market":"BIST","country":"Türkiye","theme":"Technology / AI","size":"small"},
              {"symbol":"PAPIL.IS","name":"Papilon Savunma","market":"BIST","country":"Türkiye","theme":"Biometrics / Defense","size":"micro"}
          ]

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; HisseRadar/5.0)",
              "Accept": "application/json"
          }

          previous_map = {}

          try:
              with open(PATH, "r", encoding="utf-8") as f:
                  old = json.load(f)

              previous_map = {
                  x.get("symbol"): x
                  for x in old.get("candidates", [])
                  if x.get("symbol")
              }

              print("Previous data loaded:", len(previous_map))

          except Exception as e:
              print("Previous data unavailable:", repr(e))

          def get_json(url):
              req = Request(url, headers=HEADERS)

              with urlopen(req, timeout=30) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          def average(values):
              clean = [
                  float(x)
                  for x in values
                  if x is not None
              ]

              if not clean:
                  return None

              return sum(clean) / len(clean)

          def pct_change(new, old):
              if new is None or old in (None, 0):
                  return None

              return ((new / old) - 1) * 100

          def yahoo_history(symbol):
              url = (
                  "https://query1.finance.yahoo.com/v8/finance/chart/"
                  + quote(symbol)
                  + "?interval=1d&range=1y"
              )

              try:
                  data = get_json(url)

                  results = (
                      data.get("chart", {})
                          .get("result", [])
                  )

                  if not results:
                      return None

                  item = results[0]
                  meta = item.get("meta", {})

                  q = (
                      item.get("indicators", {})
                          .get("quote", [{}])[0]
                  )

                  closes_raw = q.get("close", [])
                  volumes_raw = q.get("volume", [])
                  highs_raw = q.get("high", [])
                  lows_raw = q.get("low", [])

                  rows = []

                  for i, close_value in enumerate(closes_raw):

                      if close_value is None:
                          continue

                      rows.append({
                          "close": float(close_value),

                          "volume":
                              volumes_raw[i]
                              if i < len(volumes_raw)
                              else None,

                          "high":
                              highs_raw[i]
                              if i < len(highs_raw)
                              else None,

                          "low":
                              lows_raw[i]
                              if i < len(lows_raw)
                              else None
                      })

                  if not rows:
                      return None

                  closes = [x["close"] for x in rows]
                  volumes = [x["volume"] for x in rows]

                  last = rows[-1]
                  price = last["close"]

                  previous_close = (
                      rows[-2]["close"]
                      if len(rows) >= 2
                      else meta.get("chartPreviousClose")
                  )

                  change = None
                  change_pct = None

                  if previous_close not in (None, 0):
                      change = price - float(previous_close)
                      change_pct = (
                          change / float(previous_close)
                      ) * 100

                  def past_return(days):

                      if len(closes) <= days:
                          return None

                      return pct_change(
                          closes[-1],
                          closes[-1-days]
                      )

                  ma20 = (
                      average(closes[-20:])
                      if len(closes) >= 20
                      else average(closes)
                  )

                  ma50 = (
                      average(closes[-50:])
                      if len(closes) >= 50
                      else average(closes)
                  )

                  ma200 = (
                      average(closes[-200:])
                      if len(closes) >= 200
                      else None
                  )

                  avg_volume20 = average(
                      volumes[-20:]
                  )

                  current_volume = last["volume"]

                  volume_ratio = None

                  if (
                      current_volume is not None
                      and avg_volume20 not in (None, 0)
                  ):
                      volume_ratio = (
                          float(current_volume)
                          / float(avg_volume20)
                      )

                  returns = []

                  for i in range(1, len(closes)):

                      if closes[i-1] != 0:
                          returns.append(
                              (
                                  closes[i]
                                  / closes[i-1]
                                  - 1
                              ) * 100
                          )

                  volatility20 = None

                  if len(returns) >= 5:
                      volatility20 = (
                          statistics.pstdev(
                              returns[-20:]
                          )
                      )

                  high52 = max(closes)
                  low52 = min(closes)

                  drawdown52 = None

                  if high52 not in (None, 0):
                      drawdown52 = (
                          (price / high52) - 1
                      ) * 100

                  return {
                      "name":
                          meta.get("longName")
                          or meta.get("shortName"),

                      "price":
                          round(price, 4),

                      "previousClose":
                          round(float(previous_close), 4)
                          if previous_close is not None
                          else None,

                      "change":
                          round(change, 4)
                          if change is not None
                          else None,

                      "changePercentage":
                          round(change_pct, 4)
                          if change_pct is not None
                          else None,

                      "volume": current_volume,

                      "dayLow":
                          round(float(last["low"]), 4)
                          if last["low"] is not None
                          else None,

                      "dayHigh":
                          round(float(last["high"]), 4)
                          if last["high"] is not None
                          else None,

                      "currency":
                          meta.get("currency"),

                      "exchangeName":
                          meta.get("exchangeName"),

                      "marketCap":
                          meta.get("marketCap"),

                      "return5d":
                          past_return(5),

                      "return20d":
                          past_return(20),

                      "return60d":
                          past_return(60),

                      "return120d":
                          past_return(120),

                      "ma20": ma20,
                      "ma50": ma50,
                      "ma200": ma200,

                      "avgVolume20":
                          avg_volume20,

                      "volumeRatio":
                          volume_ratio,

                      "volatility20":
                          volatility20,

                      "high52":
                          high52,

                      "low52":
                          low52,

                      "drawdown52":
                          drawdown52
                  }

              except Exception as e:
                  print(
                      "Yahoo chart error:",
                      symbol,
                      repr(e)
                  )

                  return None

          def calculate_score(data, candidate):

              components = {
                  "momentum": 0,
                  "trend": 0,
                  "volume": 0,
                  "risk": 0,
                  "theme": 0
              }

              # MOMENTUM 30

              momentum_rules = [
                  ("return5d", 10),
                  ("return20d", 10),
                  ("return60d", 10)
              ]

              for field, maximum in momentum_rules:

                  value = data.get(field)

                  if value is None:
                      continue

                  if value >= 20:
                      points = 10

                  elif value >= 10:
                      points = 9

                  elif value >= 5:
                      points = 8

                  elif value >= 0:
                      points = 6

                  elif value >= -5:
                      points = 4

                  elif value >= -10:
                      points = 2

                  else:
                      points = 0

                  components["momentum"] += min(
                      maximum,
                      points
                  )

              # TREND 25

              price = data.get("price")
              ma20 = data.get("ma20")
              ma50 = data.get("ma50")
              ma200 = data.get("ma200")
              high52 = data.get("high52")

              if price is not None and ma20 is not None:

                  components["trend"] += (
                      6 if price > ma20 else 2
                  )

              if ma20 is not None and ma50 is not None:

                  components["trend"] += (
                      6 if ma20 > ma50 else 2
                  )

              if price is not None and ma200 is not None:

                  components["trend"] += (
                      6 if price > ma200 else 1
                  )

              else:
                  components["trend"] += 3

              if price is not None and high52 not in (None, 0):

                  ratio = price / high52

                  if ratio >= 0.95:
                      components["trend"] += 7

                  elif ratio >= 0.85:
                      components["trend"] += 6

                  elif ratio >= 0.70:
                      components["trend"] += 4

                  elif ratio >= 0.50:
                      components["trend"] += 2

              # HACİM 20

              vr = data.get("volumeRatio")

              if vr is None:
                  components["volume"] = 5

              elif vr >= 2.5:
                  components["volume"] = 20

              elif vr >= 2:
                  components["volume"] = 19

              elif vr >= 1.5:
                  components["volume"] = 17

              elif vr >= 1.2:
                  components["volume"] = 15

              elif vr >= 1:
                  components["volume"] = 13

              elif vr >= 0.8:
                  components["volume"] = 10

              elif vr >= 0.5:
                  components["volume"] = 6

              else:
                  components["volume"] = 3

              # RİSK 15

              vol = data.get("volatility20")
              drawdown = data.get("drawdown52")

              risk_points = 0

              if vol is None:
                  risk_points += 4

              elif vol <= 2:
                  risk_points += 10

              elif vol <= 4:
                  risk_points += 8

              elif vol <= 6:
                  risk_points += 6

              elif vol <= 9:
                  risk_points += 4

              else:
                  risk_points += 2

              if drawdown is None:
                  risk_points += 2

              elif drawdown >= -10:
                  risk_points += 5

              elif drawdown >= -20:
                  risk_points += 4

              elif drawdown >= -35:
                  risk_points += 3

              elif drawdown >= -50:
                  risk_points += 2

              else:
                  risk_points += 1

              components["risk"] = min(
                  15,
                  risk_points
              )

              # TEMA 10

              theme = candidate.get(
                  "theme",
                  ""
              ).lower()

              premium = [
                  "quantum",
                  "ai",
                  "space",
                  "robotics",
                  "drone",
                  "defense",
                  "biometric",
                  "technology"
              ]

              secondary = [
                  "lithium",
                  "helium"
              ]

              if any(
                  term in theme
                  for term in premium
              ):
                  components["theme"] = 10

              elif any(
                  term in theme
                  for term in secondary
              ):
                  components["theme"] = 8

              else:
                  components["theme"] = 6

              total = sum(
                  components.values()
              )

              return (
                  max(
                      0,
                      min(100, round(total))
                  ),
                  components
              )

          output_candidates = []

          fresh_count = 0
          cached_count = 0
          unavailable_count = 0

          for candidate in CANDIDATES:

              symbol = candidate["symbol"]

              print("Processing:", symbol)

              previous = previous_map.get(
                  symbol,
                  {}
              )

              data = yahoo_history(symbol)

              fresh = bool(
                  data
                  and data.get("price") is not None
              )

              if fresh:

                  fresh_count += 1

                  score, components = (
                      calculate_score(
                          data,
                          candidate
                      )
                  )

                  metrics = {
                      "return5d":
                          round(data["return5d"], 2)
                          if data.get("return5d") is not None
                          else None,

                      "return20d":
                          round(data["return20d"], 2)
                          if data.get("return20d") is not None
                          else None,

                      "return60d":
                          round(data["return60d"], 2)
                          if data.get("return60d") is not None
                          else None,

                      "return120d":
                          round(data["return120d"], 2)
                          if data.get("return120d") is not None
                          else None,

                      "volumeRatio":
                          round(data["volumeRatio"], 2)
                          if data.get("volumeRatio") is not None
                          else None,

                      "volatility20":
                          round(data["volatility20"], 2)
                          if data.get("volatility20") is not None
                          else None,

                      "ma20":
                          round(data["ma20"], 4)
                          if data.get("ma20") is not None
                          else None,

                      "ma50":
                          round(data["ma50"], 4)
                          if data.get("ma50") is not None
                          else None,

                      "ma200":
                          round(data["ma200"], 4)
                          if data.get("ma200") is not None
                          else None,

                      "drawdown52":
                          round(data["drawdown52"], 2)
                          if data.get("drawdown52") is not None
                          else None
                  }

                  name = (
                      data.get("name")
                      or candidate["name"]
                  )

                  exchange = (
                      data.get("exchangeName")
                      or candidate["market"]
                  )

                  market_cap = (
                      data.get("marketCap")
                      or previous.get("marketCap")
                  )

                  status_data = "fresh"

                  quote_source = (
                      "Yahoo Finance chart"
                  )

              elif previous.get("price") is not None:

                  cached_count += 1

                  score = previous.get(
                      "score",
                      0
                  )

                  components = previous.get(
                      "scoreComponents",
                      {}
                  )

                  metrics = previous.get(
                      "metrics",
                      {}
                  )

                  data = {
                      "price":
                          previous.get("price"),

                      "previousClose":
                          previous.get("previousClose"),

                      "change":
                          previous.get("change"),

                      "changePercentage":
                          previous.get("changePercentage")
                          if previous.get("changePercentage") is not None
                          else previous.get("changePct"),

                      "volume":
                          previous.get("volume"),

                      "dayLow":
                          previous.get("dayLow"),

                      "dayHigh":
                          previous.get("dayHigh"),

                      "currency":
                          previous.get("currency")
                  }

                  name = (
                      previous.get("name")
                      or candidate["name"]
                  )

                  exchange = (
                      previous.get("exchange")
                      or candidate["market"]
                  )

                  market_cap = (
                      previous.get("marketCap")
                  )

                  status_data = "cached"

                  quote_source = (
                      previous.get("quoteSource")
                      or "cache"
                  )

              else:

                  unavailable_count += 1

                  score = 0
                  components = {}
                  metrics = {}
                  data = {}

                  name = candidate["name"]
                  exchange = candidate["market"]
                  market_cap = None

                  status_data = "unavailable"
                  quote_source = None

              # Finansal kalite alanı.
              # Veri kaynağı bağlanana kadar puan üretmez.

              previous_financial = (
                  previous.get(
                      "financialQuality",
                      {}
                  )
              )

              financial_quality = {
                  "available":
                      previous_financial.get(
                          "available",
                          False
                      ),

                  "score":
                      previous_financial.get(
                          "score"
                      ),

                  "maxScore": 20,

                  "revenueGrowth":
                      previous_financial.get(
                          "revenueGrowth"
                      ),

                  "earningsGrowth":
                      previous_financial.get(
                          "earningsGrowth"
                      ),

                  "cash":
                      previous_financial.get(
                          "cash"
                      ),

                  "debt":
                      previous_financial.get(
                          "debt"
                      ),

                  "source":
                      previous_financial.get(
                          "source"
                      )
              }

              if score >= 85:
                  status = "ÇOK GÜÇLÜ İZLEME"

              elif score >= 75:
                  status = "GÜÇLÜ İZLEME"

              elif score >= 60:
                  status = "İZLEME"

              else:
                  status = "ADAY"

              output_candidates.append({
                  "symbol": symbol,
                  "name": name,

                  "market":
                      candidate["market"],

                  "country":
                      candidate["country"],

                  "theme":
                      candidate["theme"],

                  "size":
                      candidate["size"],

                  "score": score,

                  "scoreComponents":
                      components,

                  "metrics":
                      metrics,

                  "financialQuality":
                      financial_quality,

                  "status":
                      status,

                  "price":
                      data.get("price"),

                  "previousClose":
                      data.get("previousClose"),

                  "change":
                      data.get("change"),

                  "changePct":
                      data.get(
                          "changePercentage"
                      ),

                  "changePercentage":
                      data.get(
                          "changePercentage"
                      ),

                  "volume":
                      data.get("volume"),

                  "marketCap":
                      market_cap,

                  "dayLow":
                      data.get("dayLow"),

                  "dayHigh":
                      data.get("dayHigh"),

                  "currency":
                      data.get("currency"),

                  "exchange":
                      exchange,

                  "marketDataAvailable":
                      data.get("price") is not None,

                  "marketDataStatus":
                      status_data,

                  "quoteSource":
                      quote_source,

                  "freshness": {
                      "quote": fresh,
                      "score": fresh,
                      "financial":
                          financial_quality[
                              "available"
                          ]
                  }
              })

              time.sleep(0.30)

          output_candidates.sort(
              key=lambda item: (
                  -item.get("score", 0),
                  item.get("symbol", "")
              )
          )

          output = {
              "version":
                  "global-niche-v10",

              "scoreVersion":
                  "3.0",

              "scoreMax":
                  100,

              "generatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "count":
                  len(output_candidates),

              "marketDataCount":
                  fresh_count,

              "quoteStatus": {
                  "fresh":
                      fresh_count,

                  "cached":
                      cached_count,

                  "unavailable":
                      unavailable_count
              },

              "quoteProvider":
                  "Yahoo Finance chart / cache fallback",

              "scoreModel": {
                  "momentum": 30,
                  "trend": 25,
                  "volume": 20,
                  "risk": 15,
                  "theme": 10
              },

              "financialModel": {
                  "enabled": True,
                  "mode":
                      "verified-data-only",
                  "maxFutureScore": 20,
                  "includedInScore": False
              },

              "candidates":
                  output_candidates
          }

          os.makedirs(
              "data",
              exist_ok=True
          )

          with open(
              PATH,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print("GLOBAL NICHE RADAR V10 TAMAMLANDI")
          print("Aday sayısı:", len(CANDIDATES))
          print("Yeni veri:", fresh_count)
          print("Önbellekten:", cached_count)
          print("Veri bulunamayan:", unavailable_count)
          print("================================")

          for item in output_candidates:

              print(
                  item["symbol"],
                  "price:",
                  item["price"],
                  item["currency"],
                  "score:",
                  item["score"],
                  item["status"],
                  "financial:",
                  item["financialQuality"]["available"]
              )

          PY

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "hisse-radar-bot"
          git config user.email "actions@github.com"

          git add data/global-niche.json

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Update Global Niche Radar V10"
            git push
          fi
