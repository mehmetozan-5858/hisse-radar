name: Global Niche Radar V13

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Global Niche V13 verilerini güncelle
        run: |
          python <<'PY'
          import json
          import os
          import time
          import statistics
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from urllib.parse import quote

          PATH = "data/global-niche.json"

          CANDIDATES = [
              {"symbol":"RKLB","name":"Rocket Lab USA, Inc.","market":"NASDAQ","country":"USA","theme":"Space","size":"small"},
              {"symbol":"IONQ","name":"IonQ, Inc.","market":"NYSE","country":"USA","theme":"Quantum","size":"small"},
              {"symbol":"SOUN","name":"SoundHound AI, Inc.","market":"NASDAQ","country":"USA","theme":"AI","size":"small"},
              {"symbol":"QBTS","name":"D-Wave Quantum Inc.","market":"NYSE","country":"USA","theme":"Quantum","size":"micro"},
              {"symbol":"LUNR","name":"Intuitive Machines, Inc.","market":"NASDAQ","country":"USA","theme":"Space","size":"small"},
              {"symbol":"PNG.V","name":"Kraken Robotics Inc.","market":"TSXV","country":"Canada","theme":"Robotics","size":"micro"},
              {"symbol":"FLT.TO","name":"Volatus Aerospace Inc.","market":"TSX","country":"Canada","theme":"Drones","size":"micro"},
              {"symbol":"HE1.L","name":"Helium One Global Ltd","market":"LSE-AIM","country":"UK","theme":"Helium","size":"micro"},
              {"symbol":"DRO.AX","name":"DroneShield Limited","market":"ASX","country":"Australia","theme":"Defense / Drones","size":"small"},
              {"symbol":"LTR.AX","name":"Liontown Resources Limited","market":"ASX","country":"Australia","theme":"Lithium","size":"small"},
              {"symbol":"ALQGC.PA","name":"Quantum Genomics","market":"Euronext","country":"France","theme":"Quantum","size":"micro"},
              {"symbol":"MIATK.IS","name":"MIA Teknoloji A.S.","market":"BIST","country":"Türkiye","theme":"Technology / AI","size":"small"},
              {"symbol":"PAPIL.IS","name":"Papilon Savunma","market":"BIST","country":"Türkiye","theme":"Biometrics / Defense","size":"micro"}
          ]

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; HisseRadar/8.0)",
              "Accept": "application/json"
          }

          previous_map = {}

          try:
              with open(PATH, "r", encoding="utf-8") as f:
                  old = json.load(f)

              previous_map = {
                  x.get("symbol"): x
                  for x in old.get("candidates", [])
                  if x.get("symbol")
              }

              print("Previous data loaded:", len(previous_map))

          except Exception as e:
              print("Previous data unavailable:", repr(e))

          def get_json(url):
              req = Request(url, headers=HEADERS)
              with urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          def average(values):
              clean = [float(x) for x in values if x is not None]
              return sum(clean) / len(clean) if clean else None

          def pct_change(new, old):
              if new is None or old in (None, 0):
                  return None
              return ((float(new) / float(old)) - 1) * 100

          def yahoo_history(symbol):
              url = (
                  "https://query1.finance.yahoo.com/v8/finance/chart/"
                  + quote(symbol)
                  + "?interval=1d&range=1y"
              )

              try:
                  data = get_json(url)
                  results = data.get("chart", {}).get("result", [])

                  if not results:
                      return None

                  item = results[0]
                  meta = item.get("meta", {})
                  q = item.get("indicators", {}).get("quote", [{}])[0]

                  closes_raw = q.get("close", [])
                  volumes_raw = q.get("volume", [])
                  highs_raw = q.get("high", [])
                  lows_raw = q.get("low", [])

                  rows = []

                  for i, value in enumerate(closes_raw):
                      if value is None:
                          continue

                      rows.append({
                          "close": float(value),
                          "volume": volumes_raw[i] if i < len(volumes_raw) else None,
                          "high": highs_raw[i] if i < len(highs_raw) else None,
                          "low": lows_raw[i] if i < len(lows_raw) else None
                      })

                  if not rows:
                      return None

                  closes = [x["close"] for x in rows]
                  volumes = [x["volume"] for x in rows]

                  price = closes[-1]

                  previous_close = (
                      closes[-2]
                      if len(closes) >= 2
                      else meta.get("chartPreviousClose")
                  )

                  change = None
                  change_pct = None

                  if previous_close not in (None, 0):
                      change = price - float(previous_close)
                      change_pct = change / float(previous_close) * 100

                  def past_return(days):
                      if len(closes) <= days:
                          return None
                      return pct_change(closes[-1], closes[-1-days])

                  ma20 = average(closes[-20:])
                  ma50 = average(closes[-50:])
                  ma200 = average(closes[-200:]) if len(closes) >= 200 else None

                  avg_volume20 = average(volumes[-20:])
                  current_volume = rows[-1]["volume"]

                  volume_ratio = None

                  if current_volume is not None and avg_volume20 not in (None, 0):
                      volume_ratio = float(current_volume) / float(avg_volume20)

                  returns = []

                  for i in range(1, len(closes)):
                      if closes[i-1] != 0:
                          returns.append(
                              ((closes[i] / closes[i-1]) - 1) * 100
                          )

                  volatility20 = (
                      statistics.pstdev(returns[-20:])
                      if len(returns) >= 5
                      else None
                  )

                  high52 = max(closes)
                  low52 = min(closes)

                  drawdown52 = (
                      ((price / high52) - 1) * 100
                      if high52 else None
                  )

                  return {
                      "name": meta.get("longName") or meta.get("shortName"),
                      "price": round(price, 4),
                      "previousClose": round(float(previous_close), 4) if previous_close is not None else None,
                      "change": round(change, 4) if change is not None else None,
                      "changePercentage": round(change_pct, 4) if change_pct is not None else None,
                      "volume": current_volume,
                      "dayLow": round(float(rows[-1]["low"]), 4) if rows[-1]["low"] is not None else None,
                      "dayHigh": round(float(rows[-1]["high"]), 4) if rows[-1]["high"] is not None else None,
                      "currency": meta.get("currency"),
                      "exchangeName": meta.get("exchangeName"),
                      "marketCap": meta.get("marketCap"),
                      "return5d": past_return(5),
                      "return20d": past_return(20),
                      "return60d": past_return(60),
                      "return120d": past_return(120),
                      "ma20": ma20,
                      "ma50": ma50,
                      "ma200": ma200,
                      "volumeRatio": volume_ratio,
                      "volatility20": volatility20,
                      "high52": high52,
                      "low52": low52,
                      "drawdown52": drawdown52
                  }

              except Exception as e:
                  print("Yahoo error:", symbol, repr(e))
                  return None

          def calculate_score(data, candidate):
              c = {
                  "momentum": 0,
                  "trend": 0,
                  "volume": 0,
                  "risk": 0,
                  "theme": 0
              }

              for field in ("return5d", "return20d", "return60d"):
                  value = data.get(field)

                  if value is None:
                      continue
                  elif value >= 20:
                      points = 10
                  elif value >= 10:
                      points = 9
                  elif value >= 5:
                      points = 8
                  elif value >= 0:
                      points = 6
                  elif value >= -5:
                      points = 4
                  elif value >= -10:
                      points = 2
                  else:
                      points = 0

                  c["momentum"] += points

              price = data.get("price")
              ma20 = data.get("ma20")
              ma50 = data.get("ma50")
              ma200 = data.get("ma200")
              high52 = data.get("high52")

              if price is not None and ma20 is not None:
                  c["trend"] += 6 if price > ma20 else 2

              if ma20 is not None and ma50 is not None:
                  c["trend"] += 6 if ma20 > ma50 else 2

              if price is not None and ma200 is not None:
                  c["trend"] += 6 if price > ma200 else 1
              else:
                  c["trend"] += 3

              if price is not None and high52:
                  ratio = price / high52

                  if ratio >= .95:
                      c["trend"] += 7
                  elif ratio >= .85:
                      c["trend"] += 6
                  elif ratio >= .70:
                      c["trend"] += 4
                  elif ratio >= .50:
                      c["trend"] += 2

              vr = data.get("volumeRatio")

              if vr is None:
                  c["volume"] = 5
              elif vr >= 2.5:
                  c["volume"] = 20
              elif vr >= 2:
                  c["volume"] = 19
              elif vr >= 1.5:
                  c["volume"] = 17
              elif vr >= 1.2:
                  c["volume"] = 15
              elif vr >= 1:
                  c["volume"] = 13
              elif vr >= .8:
                  c["volume"] = 10
              elif vr >= .5:
                  c["volume"] = 6
              else:
                  c["volume"] = 3

              vol = data.get("volatility20")
              drawdown = data.get("drawdown52")

              risk = 0

              if vol is None:
                  risk += 4
              elif vol <= 2:
                  risk += 10
              elif vol <= 4:
                  risk += 8
              elif vol <= 6:
                  risk += 6
              elif vol <= 9:
                  risk += 4
              else:
                  risk += 2

              if drawdown is None:
                  risk += 2
              elif drawdown >= -10:
                  risk += 5
              elif drawdown >= -20:
                  risk += 4
              elif drawdown >= -35:
                  risk += 3
              elif drawdown >= -50:
                  risk += 2
              else:
                  risk += 1

              c["risk"] = min(15, risk)

              theme = candidate["theme"].lower()

              premium = [
                  "quantum", "ai", "space", "robotics",
                  "drone", "defense", "biometric", "technology"
              ]

              if any(x in theme for x in premium):
                  c["theme"] = 10
              elif "lithium" in theme or "helium" in theme:
                  c["theme"] = 8
              else:
                  c["theme"] = 6

              return min(100, round(sum(c.values()))), c

          output_candidates = []

          fresh_count = 0
          cached_count = 0
          unavailable_count = 0

          for candidate in CANDIDATES:
              symbol = candidate["symbol"]
              previous = previous_map.get(symbol, {})

              print("Processing:", symbol)

              data = yahoo_history(symbol)
              fresh = bool(data and data.get("price") is not None)

              if fresh:
                  fresh_count += 1
                  technical_score, components = calculate_score(data, candidate)

                  metrics = {
                      "return5d": round(data["return5d"], 2) if data.get("return5d") is not None else None,
                      "return20d": round(data["return20d"], 2) if data.get("return20d") is not None else None,
                      "return60d": round(data["return60d"], 2) if data.get("return60d") is not None else None,
                      "return120d": round(data["return120d"], 2) if data.get("return120d") is not None else None,
                      "volumeRatio": round(data["volumeRatio"], 2) if data.get("volumeRatio") is not None else None,
                      "volatility20": round(data["volatility20"], 2) if data.get("volatility20") is not None else None,
                      "ma20": round(data["ma20"], 4) if data.get("ma20") is not None else None,
                      "ma50": round(data["ma50"], 4) if data.get("ma50") is not None else None,
                      "ma200": round(data["ma200"], 4) if data.get("ma200") is not None else None,
                      "drawdown52": round(data["drawdown52"], 2) if data.get("drawdown52") is not None else None
                  }

                  name = data.get("name") or candidate["name"]
                  exchange = data.get("exchangeName") or candidate["market"]
                  market_cap = data.get("marketCap") or previous.get("marketCap")
                  data_status = "fresh"
                  quote_source = "Yahoo Finance chart"

              elif previous.get("price") is not None:
                  cached_count += 1

                  technical_score = previous.get(
                      "technicalScore",
                      previous.get("score", 0)
                  )

                  components = previous.get("scoreComponents", {})
                  metrics = previous.get("metrics", {})

                  data = {
                      "price": previous.get("price"),
                      "previousClose": previous.get("previousClose"),
                      "change": previous.get("change"),
                      "changePercentage": previous.get(
                          "changePercentage",
                          previous.get("changePct")
                      ),
                      "volume": previous.get("volume"),
                      "dayLow": previous.get("dayLow"),
                      "dayHigh": previous.get("dayHigh"),
                      "currency": previous.get("currency")
                  }

                  name = previous.get("name") or candidate["name"]
                  exchange = previous.get("exchange") or candidate["market"]
                  market_cap = previous.get("marketCap")
                  data_status = "cached"
                  quote_source = "cache"

              else:
                  unavailable_count += 1
                  technical_score = 0
                  components = {}
                  metrics = {}
                  data = {}

                  name = candidate["name"]
                  exchange = candidate["market"]
                  market_cap = None
                  data_status = "unavailable"
                  quote_source = None

              score = technical_score

              if score >= 85:
                  status = "ÇOK GÜÇLÜ İZLEME"
              elif score >= 75:
                  status = "GÜÇLÜ İZLEME"
              elif score >= 60:
                  status = "İZLEME"
              else:
                  status = "ADAY"

              confidence = "MEDIUM" if fresh else "LOW"

              output_candidates.append({
                  "symbol": symbol,
                  "name": name,
                  "market": candidate["market"],
                  "country": candidate["country"],
                  "theme": candidate["theme"],
                  "size": candidate["size"],

                  "score": score,
                  "technicalScore": technical_score,
                  "scoreComponents": components,
                  "metrics": metrics,

                  "financialQuality": {
                      "available": False,
                      "score": None,
                      "maxScore": 20,
                      "coverage": 0,
                      "source": None,
                      "reason": "Financial provider pending"
                  },

                  "researchConfidence": confidence,
                  "status": status,

                  "price": data.get("price"),
                  "previousClose": data.get("previousClose"),
                  "change": data.get("change"),
                  "changePct": data.get("changePercentage"),
                  "changePercentage": data.get("changePercentage"),
                  "volume": data.get("volume"),
                  "marketCap": market_cap,
                  "dayLow": data.get("dayLow"),
                  "dayHigh": data.get("dayHigh"),
                  "currency": data.get("currency"),
                  "exchange": exchange,

                  "marketDataAvailable": data.get("price") is not None,
                  "marketDataStatus": data_status,
                  "quoteSource": quote_source
              })

              time.sleep(0.25)

          output_candidates.sort(
              key=lambda x: (-x.get("score", 0), x["symbol"])
          )

          output = {
              "version": "global-niche-v13",
              "scoreVersion": "3.3",
              "scoreMax": 100,
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "count": len(output_candidates),
              "marketDataCount": fresh_count,
              "financialDataCount": 0,

              "quoteStatus": {
                  "fresh": fresh_count,
                  "cached": cached_count,
                  "unavailable": unavailable_count
              },

              "quoteProvider": "Yahoo Finance chart / cache fallback",
              "financialProvider": "pending",

              "scoreModel": {
                  "momentum": 30,
                  "trend": 25,
                  "volume": 20,
                  "risk": 15,
                  "theme": 10
              },

              "financialModel": {
                  "enabled": False,
                  "maxScore": 20,
                  "includedInMainScore": False,
                  "principle": "verified-data-only"
              },

              "candidates": output_candidates
          }

          os.makedirs("data", exist_ok=True)

          with open(PATH, "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print("GLOBAL NICHE RADAR V13 TAMAMLANDI")
          print("Aday sayısı:", len(CANDIDATES))
          print("Yeni fiyat:", fresh_count)
          print("Önbellekten:", cached_count)
          print("Fiyat bulunamayan:", unavailable_count)
          print("Finansal katman: güvenilir kaynak bekliyor")
          print("================================")

          for item in output_candidates:
              print(
                  item["symbol"],
                  "technical:", item["technicalScore"],
                  "data:", item["marketDataStatus"],
                  "confidence:", item["researchConfidence"]
              )

          PY

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "hisse-radar-bot"
          git config user.email "actions@github.com"

          git add data/global-niche.json

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Update Global Niche Radar V13"
            git push
          fi
