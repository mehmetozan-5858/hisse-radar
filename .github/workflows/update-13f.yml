name: Update 13F Institutional Data

on:
  workflow_dispatch:
  schedule:
    - cron: "25 8 * * 1"

permissions:
  contents: write

jobs:
  update-13f:
    runs-on: ubuntu-latest

    env:
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SEC 13F verisini güncelle
        run: |
          python <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          from datetime import datetime, timezone, date

          CONTACT = os.environ.get(
              "SEC_CONTACT_EMAIL", ""
          ).strip()

          if not CONTACT:
              raise RuntimeError(
                  "SEC_CONTACT_EMAIL secret bulunamadı."
              )

          HEADERS = {
              "User-Agent": f"HisseRadar/1.0 {CONTACT}",
              "Accept-Encoding": "identity",
              "Accept": (
                  "application/json,text/html,"
                  "application/xml;q=0.9,*/*;q=0.8"
              ),
              "Connection": "close"
          }

          SYMBOLS = {
              "AAPL": ["037833100"],
              "MSFT": ["594918104"],
              "NVDA": ["67066G104"],
              "AMZN": ["023135106"],
              "GOOGL": ["02079K107", "02079K305"],
              "META": ["30303M102"],
              "TSLA": ["88160R101"]
          }

          MANAGERS = {
              "Berkshire Hathaway": "0001067983",
              "BlackRock": "0001364742",
              "Vanguard Group": "0000102909"
          }

          # Bir yöneticinin son raporu bundan daha eskiyse
          # puana dahil edilmez.
          MAX_REPORT_AGE_DAYS = 240

          # Aynı yöneticinin ardışık iki raporu arasındaki
          # makul çeyreklik gün farkı.
          MIN_QUARTER_DAYS = 70
          MAX_QUARTER_DAYS = 120

          # %100'ü aşan ham hisse değişimini otomatik olarak
          # puanlamak yerine anomaly olarak işaretliyoruz.
          # Split / CUSIP / veri yapısı değişikliklerine karşı koruma.
          MAX_ABS_CHANGE_PCT = 100.0

          last_request = 0.0

          def sec_request(url, retries=3):
              global last_request

              for attempt in range(retries):
                  elapsed = time.time() - last_request

                  if elapsed < 0.5:
                      time.sleep(0.5 - elapsed)

                  req = urllib.request.Request(
                      url,
                      headers=HEADERS,
                      method="GET"
                  )

                  try:
                      with urllib.request.urlopen(
                          req,
                          timeout=40
                      ) as response:
                          last_request = time.time()
                          return response.read()

                  except urllib.error.HTTPError as e:
                      last_request = time.time()

                      if (
                          e.code in (403, 429)
                          and attempt < retries - 1
                      ):
                          time.sleep(5 * (attempt + 1))
                          continue

                      raise

                  except Exception:
                      last_request = time.time()

                      if attempt < retries - 1:
                          time.sleep(3 * (attempt + 1))
                          continue

                      raise

          def sec_json(url):
              raw = sec_request(url)
              return json.loads(
                  raw.decode("utf-8", errors="replace")
              )

          def normalize_cusip(value):
              return re.sub(
                  r"[^0-9A-Z]",
                  "",
                  (value or "").upper()
              )

          def tag_name(tag):
              return tag.split("}")[-1].lower()

          def child_text(node, wanted):
              wanted = wanted.lower()

              for element in node.iter():
                  if tag_name(element.tag) == wanted:
                      return (element.text or "").strip()

              return ""

          def number(value):
              try:
                  return float(
                      str(value).replace(",", "").strip()
                  )
              except Exception:
                  return 0.0

          def parse_date(value):
              if not value:
                  return None

              try:
                  return datetime.strptime(
                      value,
                      "%Y-%m-%d"
                  ).date()
              except Exception:
                  return None

          def recent_13f_filings(cik):
              data = sec_json(
                  f"https://data.sec.gov/submissions/"
                  f"CIK{cik}.json"
              )

              recent = (
                  data.get("filings", {})
                  .get("recent", {})
              )

              forms = recent.get("form", [])
              accessions = recent.get(
                  "accessionNumber", []
              )
              filing_dates = recent.get(
                  "filingDate", []
              )
              report_dates = recent.get(
                  "reportDate", []
              )
              primary_docs = recent.get(
                  "primaryDocument", []
              )

              filings = []

              for i, form in enumerate(forms):
                  if form != "13F-HR":
                      continue

                  filings.append({
                      "accession": accessions[i],
                      "filingDate": (
                          filing_dates[i]
                          if i < len(filing_dates)
                          else None
                      ),
                      "reportDate": (
                          report_dates[i]
                          if i < len(report_dates)
                          else None
                      ),
                      "primaryDocument": (
                          primary_docs[i]
                          if i < len(primary_docs)
                          else None
                      )
                  })

                  if len(filings) >= 2:
                      break

              return filings

          def filing_base(cik, accession):
              cik_plain = str(int(cik))
              accession_plain = accession.replace(
                  "-", ""
              )

              return (
                  "https://www.sec.gov/Archives/"
                  f"edgar/data/{cik_plain}/"
                  f"{accession_plain}/"
              )

          def information_table(cik, filing):
              base = filing_base(
                  cik,
                  filing["accession"]
              )

              index = sec_json(base + "index.json")

              items = (
                  index.get("directory", {})
                  .get("item", [])
              )

              primary = (
                  filing.get("primaryDocument") or ""
              ).split("/")[-1].lower()

              candidates = []

              for item in items:
                  name = item.get("name", "")
                  lower = name.lower()

                  if not lower.endswith(
                      (".xml", ".txt")
                  ):
                      continue

                  if primary and lower == primary:
                      continue

                  priority = 20

                  if "infotable" in lower:
                      priority = 0
                  elif "informationtable" in lower:
                      priority = 1
                  elif "13finfo" in lower:
                      priority = 2
                  elif lower.endswith(".xml"):
                      priority = 10

                  candidates.append(
                      (priority, name)
                  )

              candidates.sort()

              for _, name in candidates:
                  url = base + name

                  try:
                      raw = sec_request(url)

                      text = raw.decode(
                          "utf-8",
                          errors="ignore"
                      ).lower()

                      if (
                          "<cusip>" in text
                          and (
                              "infotable" in text
                              or "informationtable" in text
                          )
                      ):
                          return url, raw

                  except Exception:
                      continue

              return None, None

          def parse_holdings(raw):
              holdings = {}

              if not raw:
                  return holdings

              try:
                  root = ET.fromstring(raw)
              except Exception:
                  return holdings

              for row in root.iter():
                  if tag_name(row.tag) != "infotable":
                      continue

                  cusip = normalize_cusip(
                      child_text(row, "cusip")
                  )

                  shares = number(
                      child_text(row, "sshprnamt")
                  )

                  value_thousands = number(
                      child_text(row, "value")
                  )

                  if not cusip:
                      continue

                  item = holdings.setdefault(
                      cusip,
                      {
                          "shares": 0.0,
                          "value": 0.0
                      }
                  )

                  item["shares"] += shares
                  item["value"] += (
                      value_thousands * 1000
                  )

              return holdings

          def manager_data(name, cik):
              result = {
                  "manager": name,
                  "cik": cik,
                  "status": "error",
                  "eligible": False,
                  "latest": None,
                  "previous": None,
                  "holdings": {},
                  "error": None
              }

              try:
                  filings = recent_13f_filings(cik)

                  if len(filings) < 2:
                      result["status"] = (
                          "insufficient_filings"
                      )
                      return result

                  latest_filing = filings[0]
                  previous_filing = filings[1]

                  latest_date = parse_date(
                      latest_filing["reportDate"]
                  )
                  previous_date = parse_date(
                      previous_filing["reportDate"]
                  )

                  if not latest_date or not previous_date:
                      result["status"] = (
                          "invalid_report_dates"
                      )
                      return result

                  age_days = (
                      date.today() - latest_date
                  ).days

                  quarter_gap = (
                      latest_date - previous_date
                  ).days

                  if age_days > MAX_REPORT_AGE_DAYS:
                      result["status"] = "stale"
                      result["latest"] = latest_filing
                      result["previous"] = previous_filing
                      return result

                  if not (
                      MIN_QUARTER_DAYS
                      <= quarter_gap
                      <= MAX_QUARTER_DAYS
                  ):
                      result["status"] = (
                          "non_comparable_periods"
                      )
                      result["latest"] = latest_filing
                      result["previous"] = previous_filing
                      return result

                  parsed = []

                  for filing in (
                      latest_filing,
                      previous_filing
                  ):
                      source_url, raw = (
                          information_table(
                              cik,
                              filing
                          )
                      )

                      if not raw:
                          raise RuntimeError(
                              "13F information table "
                              "bulunamadı."
                          )

                      holdings = parse_holdings(raw)

                      if not holdings:
                          raise RuntimeError(
                              "13F information table "
                              "okunamadı."
                          )

                      parsed.append({
                          **filing,
                          "sourceUrl": source_url,
                          "holdings": holdings
                      })

                  latest = parsed[0]
                  previous = parsed[1]

                  result["latest"] = {
                      k: v
                      for k, v in latest.items()
                      if k != "holdings"
                  }

                  result["previous"] = {
                      k: v
                      for k, v in previous.items()
                      if k != "holdings"
                  }

                  for symbol, cusips in SYMBOLS.items():
                      latest_shares = 0.0
                      previous_shares = 0.0
                      latest_value = 0.0
                      previous_value = 0.0

                      for cusip in cusips:
                          c = normalize_cusip(cusip)

                          lh = latest[
                              "holdings"
                          ].get(c, {})

                          ph = previous[
                              "holdings"
                          ].get(c, {})

                          latest_shares += lh.get(
                              "shares", 0.0
                          )
                          previous_shares += ph.get(
                              "shares", 0.0
                          )
                          latest_value += lh.get(
                              "value", 0.0
                          )
                          previous_value += ph.get(
                              "value", 0.0
                          )

                      change = (
                          latest_shares
                          - previous_shares
                      )

                      if previous_shares > 0:
                          change_pct = (
                              change
                              / previous_shares
                          ) * 100
                      elif latest_shares > 0:
                          change_pct = None
                      else:
                          change_pct = 0.0

                      anomaly = False
                      anomaly_reason = None

                      if (
                          change_pct is not None
                          and abs(change_pct)
                          > MAX_ABS_CHANGE_PCT
                      ):
                          anomaly = True
                          anomaly_reason = (
                              "share_change_over_100pct"
                          )

                      result["holdings"][symbol] = {
                          "latestShares":
                              latest_shares,
                          "previousShares":
                              previous_shares,
                          "shareChange":
                              change,
                          "shareChangePct":
                              change_pct,
                          "latestValue":
                              latest_value,
                          "previousValue":
                              previous_value,
                          "anomaly":
                              anomaly,
                          "anomalyReason":
                              anomaly_reason
                      }

                  result["eligible"] = True
                  result["status"] = "ok"

                  return result

              except Exception as exc:
                  result["error"] = str(exc)
                  return result

          managers = []

          for manager_name, cik in MANAGERS.items():
              print(
                  f"13F okunuyor: {manager_name}"
              )

              managers.append(
                  manager_data(
                      manager_name,
                      cik
                  )
              )

          stocks = {}

          for symbol in SYMBOLS:
              increases = 0
              decreases = 0
              unchanged = 0
              anomalies = 0
              valid_managers = 0
              details = []

              for manager in managers:
                  if not manager["eligible"]:
                      continue

                  holding = manager[
                      "holdings"
                  ].get(symbol)

                  if holding is None:
                      continue

                  if holding["anomaly"]:
                      anomalies += 1

                      details.append({
                          "manager":
                              manager["manager"],
                          "direction":
                              "anomaly",
                          **holding
                      })

                      continue

                  # Yöneticinin iki dönemde de bu hisseyi
                  # hiç tutmaması sinyal değildir.
                  if (
                      holding["latestShares"] == 0
                      and holding["previousShares"] == 0
                  ):
                      continue

                  valid_managers += 1

                  change = holding[
                      "shareChange"
                  ]

                  if change > 0:
                      direction = "increase"
                      increases += 1
                  elif change < 0:
                      direction = "decrease"
                      decreases += 1
                  else:
                      direction = "unchanged"
                      unchanged += 1

                  details.append({
                      "manager":
                          manager["manager"],
                      "direction":
                          direction,
                      **holding
                  })

              if valid_managers == 0:
                  score = None
                  status = "unavailable"
              else:
                  raw_score = (
                      5
                      + increases * 1.5
                      - decreases * 1.5
                  )

                  score = round(
                      max(
                          0,
                          min(10, raw_score)
                      )
                  )

                  status = "ok"

              stocks[symbol] = {
                  "status": status,
                  "score": score,
                  "maxScore": 10,
                  "increases": increases,
                  "decreases": decreases,
                  "unchanged": unchanged,
                  "anomaliesExcluded": anomalies,
                  "validManagers": valid_managers,
                  "managers": details
              }

          output = {
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "version": "0.4.2",
              "source": "SEC EDGAR Form 13F-HR",
              "max_score": 10,
              "method": {
                  "maxReportAgeDays":
                      MAX_REPORT_AGE_DAYS,
                  "quarterGapDays": [
                      MIN_QUARTER_DAYS,
                      MAX_QUARTER_DAYS
                  ],
                  "maxAbsChangePct":
                      MAX_ABS_CHANGE_PCT
              },
              "note": (
                  "13F gerçek zamanlı değildir. "
                  "Eski yöneticiler ve anormal hisse "
                  "değişimleri puandan çıkarılır."
              ),
              "managers": [
                  {
                      "manager": m["manager"],
                      "cik": m["cik"],
                      "status": m["status"],
                      "eligible": m["eligible"],
                      "latest": m["latest"],
                      "previous": m["previous"],
                      "error": m["error"]
                  }
                  for m in managers
              ],
              "stocks": stocks
          }

          os.makedirs("data", exist_ok=True)

          with open(
              "data/13f.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

      - name: 13F verisini kaydet
        run: |
          git config user.name "hisse-radar-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/13f.json

          if git diff --cached --quiet; then
            echo "13F verisinde değişiklik yok."
          else
            git commit -m "Improve SEC 13F scoring v0.4.2"
            git push
          fi
