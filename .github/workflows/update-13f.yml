name: Update 13F Institutional Data

on:
  workflow_dispatch:
  schedule:
    - cron: "25 8 * * 1"

permissions:
  contents: write

jobs:
  update-13f:
    runs-on: ubuntu-latest

    env:
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SEC 13F verisini güncelle
        run: |
          python <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          CONTACT = os.environ.get("SEC_CONTACT_EMAIL", "").strip()

          if not CONTACT:
              raise RuntimeError("SEC_CONTACT_EMAIL secret bulunamadı.")

          SEC_HEADERS = {
              "User-Agent": f"HisseRadar/1.0 {CONTACT}",
              "Accept-Encoding": "identity",
              "Accept": "application/json,text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Connection": "close"
          }

          SYMBOLS = {
              "AAPL": ["037833100"],
              "MSFT": ["594918104"],
              "NVDA": ["67066G104"],
              "AMZN": ["023135106"],
              "GOOGL": ["02079K107", "02079K305"],
              "META": ["30303M102"],
              "TSLA": ["88160R101"]
          }

          MANAGERS = {
              "Berkshire Hathaway": "0001067983",
              "BlackRock": "0001364742",
              "Vanguard Group": "0000102909"
          }

          last_request = 0.0

          def sec_request(url, retries=3):
              global last_request

              for attempt in range(retries):
                  # SEC limitinin oldukça altında kal.
                  elapsed = time.time() - last_request
                  if elapsed < 0.5:
                      time.sleep(0.5 - elapsed)

                  req = urllib.request.Request(
                      url,
                      headers=SEC_HEADERS,
                      method="GET"
                  )

                  try:
                      with urllib.request.urlopen(req, timeout=40) as response:
                          last_request = time.time()
                          return response.read()

                  except urllib.error.HTTPError as e:
                      last_request = time.time()

                      if e.code in (403, 429) and attempt < retries - 1:
                          time.sleep(5 * (attempt + 1))
                          continue

                      raise

                  except Exception:
                      last_request = time.time()

                      if attempt < retries - 1:
                          time.sleep(3 * (attempt + 1))
                          continue

                      raise

          def sec_json(url):
              return json.loads(
                  sec_request(url).decode("utf-8", errors="replace")
              )

          def normalize_cusip(value):
              return re.sub(
                  r"[^0-9A-Z]",
                  "",
                  (value or "").upper()
              )

          def clean_tag(tag):
              return tag.split("}")[-1].lower()

          def child_text(node, wanted):
              wanted = wanted.lower()

              for element in node.iter():
                  if clean_tag(element.tag) == wanted:
                      return (element.text or "").strip()

              return ""

          def number(value):
              try:
                  return float(
                      str(value).replace(",", "").strip()
                  )
              except Exception:
                  return 0.0

          def recent_filings(cik):
              data = sec_json(
                  f"https://data.sec.gov/submissions/CIK{cik}.json"
              )

              recent = data.get("filings", {}).get("recent", {})

              forms = recent.get("form", [])
              accessions = recent.get("accessionNumber", [])
              filing_dates = recent.get("filingDate", [])
              report_dates = recent.get("reportDate", [])
              primary_docs = recent.get("primaryDocument", [])

              output = []

              for i, form in enumerate(forms):
                  if form != "13F-HR":
                      continue

                  output.append({
                      "accession": accessions[i],
                      "filingDate":
                          filing_dates[i]
                          if i < len(filing_dates)
                          else None,
                      "reportDate":
                          report_dates[i]
                          if i < len(report_dates)
                          else None,
                      "primaryDocument":
                          primary_docs[i]
                          if i < len(primary_docs)
                          else None
                  })

                  if len(output) == 2:
                      break

              return output

          def filing_directory(cik, accession):
              cik_plain = str(int(cik))
              accession_plain = accession.replace("-", "")

              return (
                  "https://www.sec.gov/Archives/edgar/data/"
                  f"{cik_plain}/{accession_plain}/"
              )

          def filing_index_json(cik, accession):
              base = filing_directory(cik, accession)
              return sec_json(base + "index.json")

          def find_info_table(cik, filing):
              accession = filing["accession"]
              base = filing_directory(cik, accession)
              index = filing_index_json(cik, accession)

              items = (
                  index.get("directory", {})
                  .get("item", [])
              )

              primary = (
                  filing.get("primaryDocument") or ""
              ).lower()

              candidates = []

              for item in items:
                  name = item.get("name", "")
                  lower = name.lower()

                  if not lower.endswith((".xml", ".txt")):
                      continue

                  # Primary 13F cover formunu atla.
                  if primary and lower == primary:
                      continue

                  priority = 10

                  if "infotable" in lower:
                      priority = 0
                  elif "informationtable" in lower:
                      priority = 1
                  elif "13finfo" in lower:
                      priority = 2
                  elif lower.endswith(".xml"):
                      priority = 5

                  candidates.append(
                      (priority, name)
                  )

              candidates.sort()

              for _, name in candidates:
                  url = base + name

                  try:
                      raw = sec_request(url)
                      text = raw.decode(
                          "utf-8",
                          errors="ignore"
                      ).lower()

                      if (
                          "<cusip>" in text
                          and (
                              "infotable" in text
                              or "informationtable" in text
                          )
                      ):
                          return url, raw

                  except Exception:
                      continue

              return None, None

          def parse_holdings(raw):
              holdings = {}

              if not raw:
                  return holdings

              try:
                  root = ET.fromstring(raw)
              except Exception:
                  return holdings

              for row in root.iter():
                  if clean_tag(row.tag) != "infotable":
                      continue

                  cusip = normalize_cusip(
                      child_text(row, "cusip")
                  )

                  shares = number(
                      child_text(row, "sshprnamt")
                  )

                  value_thousands = number(
                      child_text(row, "value")
                  )

                  if not cusip:
                      continue

                  current = holdings.setdefault(
                      cusip,
                      {
                          "shares": 0.0,
                          "value": 0.0
                      }
                  )

                  current["shares"] += shares
                  current["value"] += (
                      value_thousands * 1000
                  )

              return holdings

          def manager_data(manager, cik):
              result = {
                  "manager": manager,
                  "cik": cik,
                  "status": "error",
                  "latest": None,
                  "previous": None,
                  "holdings": {},
                  "error": None
              }

              try:
                  filings = recent_filings(cik)

                  if len(filings) < 2:
                      result["status"] = "insufficient_filings"
                      return result

                  parsed = []

                  for filing in filings[:2]:
                      source_url, raw = find_info_table(
                          cik,
                          filing
                      )

                      if not raw:
                          raise RuntimeError(
                              "13F information table bulunamadı."
                          )

                      holdings = parse_holdings(raw)

                      if not holdings:
                          raise RuntimeError(
                              "13F information table okunamadı."
                          )

                      parsed.append({
                          **filing,
                          "sourceUrl": source_url,
                          "holdings": holdings
                      })

                  latest = parsed[0]
                  previous = parsed[1]

                  result["latest"] = {
                      k: v
                      for k, v in latest.items()
                      if k != "holdings"
                  }

                  result["previous"] = {
                      k: v
                      for k, v in previous.items()
                      if k != "holdings"
                  }

                  for symbol, cusips in SYMBOLS.items():
                      latest_shares = 0.0
                      previous_shares = 0.0
                      latest_value = 0.0
                      previous_value = 0.0

                      for cusip in cusips:
                          c = normalize_cusip(cusip)

                          lh = latest["holdings"].get(c, {})
                          ph = previous["holdings"].get(c, {})

                          latest_shares += lh.get(
                              "shares", 0.0
                          )
                          previous_shares += ph.get(
                              "shares", 0.0
                          )
                          latest_value += lh.get(
                              "value", 0.0
                          )
                          previous_value += ph.get(
                              "value", 0.0
                          )

                      share_change = (
                          latest_shares
                          - previous_shares
                      )

                      if previous_shares > 0:
                          change_pct = (
                              share_change
                              / previous_shares
                          ) * 100
                      elif latest_shares > 0:
                          change_pct = None
                      else:
                          change_pct = 0.0

                      result["holdings"][symbol] = {
                          "latestShares": latest_shares,
                          "previousShares": previous_shares,
                          "shareChange": share_change,
                          "shareChangePct": change_pct,
                          "latestValue": latest_value,
                          "previousValue": previous_value
                      }

                  result["status"] = "ok"
                  return result

              except Exception as e:
                  result["error"] = str(e)
                  return result

          managers = []

          for name, cik in MANAGERS.items():
              print(f"13F okunuyor: {name}")
              managers.append(
                  manager_data(name, cik)
              )

          stocks = {}

          for symbol in SYMBOLS:
              increases = 0
              decreases = 0
              unchanged = 0
              valid = 0
              reported_value = 0.0
              details = []

              for manager in managers:
                  if manager["status"] != "ok":
                      continue

                  holding = manager["holdings"].get(
                      symbol
                  )

                  if holding is None:
                      continue

                  valid += 1
                  reported_value += holding[
                      "latestValue"
                  ]

                  change = holding["shareChange"]

                  if change > 0:
                      direction = "increase"
                      increases += 1
                  elif change < 0:
                      direction = "decrease"
                      decreases += 1
                  else:
                      direction = "unchanged"
                      unchanged += 1

                  details.append({
                      "manager": manager["manager"],
                      "direction": direction,
                      **holding
                  })

              if valid == 0:
                  score = None
                  status = "unavailable"
              else:
                  raw_score = (
                      5
                      + increases * 1.5
                      - decreases * 1.5
                  )

                  score = round(
                      max(0, min(10, raw_score))
                  )

                  status = "ok"

              stocks[symbol] = {
                  "status": status,
                  "score": score,
                  "maxScore": 10,
                  "increases": increases,
                  "decreases": decreases,
                  "unchanged": unchanged,
                  "validManagers": valid,
                  "latestReportedValue": reported_value,
                  "managers": details
              }

          output = {
              "updated_at":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),
              "version": "0.4.1",
              "source":
                  "SEC EDGAR Form 13F-HR",
              "max_score": 10,
              "note": (
                  "13F verileri gerçek zamanlı değildir. "
                  "Son iki bildirilen çeyrek karşılaştırılır."
              ),
              "managers": [
                  {
                      "manager": x["manager"],
                      "cik": x["cik"],
                      "status": x["status"],
                      "latest": x["latest"],
                      "previous": x["previous"],
                      "error": x["error"]
                  }
                  for x in managers
              ],
              "stocks": stocks
          }

          os.makedirs("data", exist_ok=True)

          with open(
              "data/13f.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("data/13f.json oluşturuldu.")
          print(
              json.dumps(
                  stocks,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

      - name: 13F verisini kaydet
        run: |
          git config user.name "hisse-radar-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/13f.json

          if git diff --cached --quiet; then
            echo "13F verisinde değişiklik yok."
          else
            git commit -m "Update SEC 13F institutional data v0.4.1"
            git push
          fi
