name: Update Congress Disclosures

on:
  workflow_dispatch:
  schedule:
    - cron: "27 14 * * *"

permissions:
  contents: write

concurrency:
  group: update-congress-disclosures
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pypdf==6.1.0
      - name: Verify disclosure validator
        run: python -m unittest -q test_congress_feed
      - name: Fetch official House Clerk PTR disclosures
        run: python house_congress_feed.py
      - name: Commit updated feed
        run: |
          if git diff --quiet -- data/congress-trades.json; then
            echo "No disclosure update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/congress-trades.json
          git commit -m "Update official House Congress disclosures"
          git push
