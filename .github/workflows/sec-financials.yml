name: SEC Annual Fundamentals

on:
  workflow_dispatch:
  schedule:
    - cron: "37 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: sec-annual-fundamentals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load SEC companyfacts with declared contact
        env:
          SEC_USER_AGENT: HisseRadar/2.0 ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python sec_financials.py
      - name: Publish public financial facts only
        run: |
          git config user.name "hisse-radar-bot"
          git config user.email "actions@github.com"
          git add data/sec-financials.json
          git diff --cached --quiet || (git commit -m "Update SEC annual fundamentals" && git push)
